<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vesper Eye</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #101014; color: #ECE8E1; font: clamp(15px, 0.72vw, 22px)/1.5 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: #101014ee; backdrop-filter: blur(8px); border-bottom: 1px solid #2a2a33; padding: 12px clamp(14px, 3vw, 36px); }
h1 { font-size: 1.35em; font-weight: 600; margin: 0 0 2px; }
header p { margin: 0 0 10px; color: #A9A49B; font-size: 0.92em; max-width: 120ch; }
.bar { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.bar span { color: #A9A49B; font-size: 0.9em; margin-right: 4px; }
button { font: inherit; color: #ECE8E1; background: #1b1b22; border: 1px solid #3a3a46; border-radius: 9px; padding: 0.4em 0.95em; cursor: pointer; }
button:hover, button:focus-visible { border-color: #E9B44C; outline: none; }
button[aria-pressed=true] { border-color: #E9B44C; color: #E9B44C; }
main { display: grid; grid-template-columns: 1fr; gap: 22px; padding: 18px clamp(14px, 3vw, 36px) 40px; }
@media (min-width: 1100px) { main { grid-template-columns: 1fr 1fr; } }
.card h2 { font-size: 1.1em; font-weight: 600; margin: 0 0 2px; }
.card p { margin: 0 0 8px; color: #A9A49B; font-size: 0.9em; }
.desk { position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background-size: cover; background-position: center; border: 1px solid #2a2a33; }
.desk canvas { position: absolute; left: 50%; top: 50%; width: 48.6%; aspect-ratio: 5.7 / 2.7; transform: translate(-50%, -50%); }
body.sheet .desk { aspect-ratio: 5.7 / 3.1; background-size: 206% auto; }
body.sheet .desk canvas { width: 100%; }
.wide { grid-column: 1 / -1; }
.wide .desk { aspect-ratio: 16 / 7; }
.err { white-space: pre-wrap; color: #ff8080; font: 12px ui-monospace, monospace; padding: 0 36px; }
</style>
<body>
<header>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <div class="bar" id="poses"><span>Выражение:</span></div>
</header>
<main id="main"></main>
<pre class="err" id="err"></pre>
<script>
const DATA = /*__DATA__*/null;
const WALLS = /*__WALLS__*/null;
const PAGE = /*__PAGE__*/null;
const VIEWS = PAGE.views;
const POSES = {
  'Покой': {},
  'Смеётся': { lt: 0.20, lb: 0.10, face: [0, 0.85, 0, 0], pose: [1, 0, 0, 0], mood: [0, 0, 0, 0.12], pupil: 1.08, bob: 1 },
  'Удивлён': { lt: 0, pupil: 0.72, pose: [0, 0, 0, 1], mood: [0.5, 0, 0, 0] },
  'Боится': { lt: 0, pupil: 0.58, mood: [1, 0, 0, 0], pose: [0, 1, 0, 0], jitter: 1 },
  'Грустит': { lt: 0.26, face: [0, 0, 1, 0], mood: [0, 0, 0, 0.5], pupil: 1.06, gy: 0.45 },
  'Сердится': { lt: 0.42, lb: 0.26, pupil: 0.78, mood: [0.2, 0, 0, 0] },
  'Устал': { lt: 0.58, mood: [0, 1, 0, 0], gy: 0.15 },
  'Спит': { lt: 1, lb: 1, dim: 0.65, sleep: 1 },
  'Дремлет': { lt: 0.97, pupil: 1.12, gy: 0.14, still: 1 },
  'Моргнул': { lt: 1, lb: 0.9, still: 1 },
};
const VS = `#version 300 es
in vec2 a; out vec2 vUv;
void main() { vUv = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); gl_Position = vec4(a, 0.0, 1.0); }`;
const UNI = ['uTime','uSize','uUnit','uPupil','uGaze','uGaze2','uLidTop','uLidBot','uEnergy','uWake','uPulse','uDim','uPulseDir','uLight','uC0','uC1','uC2','uC3','uC4','uC5','uC6','uC7','uP0','uP1','uMood','uFace','uPose'];
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255, 1]; };
function fail(msg) { document.getElementById('err').textContent += msg + '\n'; console.log('SHADER-ERROR ' + msg); }
let current = POSES['Покой'];
// Служебный режим ?sheet=N: один вариант во всех выражениях сразу.
const QS = new URLSearchParams(location.search);
if (QS.has('sheet')) { const base = VIEWS[+QS.get('sheet')] || VIEWS[0]; VIEWS.length = 0; for (const name of (PAGE.poses || Object.keys(POSES))) VIEWS.push({ ...base, title: name, note: '', fixed: name }); }
const pointer = { x: innerWidth / 2, y: innerHeight / 2, t: 0 };
addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.t = performance.now(); });

function Eye(canvas, view) {
  const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, antialias: false });
  if (!gl) { fail('WebGL2 недоступен'); return null; }
  const skin = DATA.skins[view.skin], v = Object.assign({}, skin.variants[view.variant] || Object.values(skin.variants)[0], view.over || {});
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(view.skin + ': ' + gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, DATA.shaders[skin.shader]));
  gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail(view.skin + ': ' + gl.getProgramInfoLog(prog));
  const loc = {}; for (const u of UNI) loc[u] = gl.getUniformLocation(prog, u);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const A = gl.getAttribLocation(prog, 'a');
  const ch = skin.character || {};
  const s = { gx: 0, gy: 0, vx: 0, vy: 0, px: 0, py: 0, tx: 0, ty: 0, wx: 0, wy: 0, nextLook: 0, blink: 0, blinkT: -1, nextBlink: 1500 + Math.random() * 2500,
    lt: skin.restLid ?? 0.2, lb: 0, pupil: 1, dim: 1, wake: 0, mood: [0, 0, 0, 0], face: [0, 0, 0, 0], pose: [0, 0, 0, 0], t0: performance.now() };
  const eye = { view, canvas };
  eye.frame = function (now, dt) {
    const pose = view.fixed ? POSES[view.fixed] : current;
    const r = canvas.getBoundingClientRect(), unit = Math.min(r.height / 2.7, r.width / 5.7);
    // Взгляд: за указателем, а если он давно не двигался — сам по сторонам.
    const idle = now - pointer.t > 3500;
    if (idle) { if (now > s.nextLook) { s.wx = (Math.random() * 2 - 1) * 0.8; s.wy = (Math.random() * 2 - 1) * 0.5; s.nextLook = now + 900 + Math.random() * 2600; } s.tx = s.wx; s.ty = s.wy; }
    else { const dx = pointer.x - (r.left + r.width / 2), dy = pointer.y - (r.top + r.height / 2), n = Math.hypot(dx, dy, 2.2 * unit); s.tx = dx / n; s.ty = dy / n; }
    if (pose.sleep) { s.tx = 0; s.ty = 0.2; }
    if (pose.still) { s.tx = 0; s.ty = pose.gy || 0; }
    if (pose.gy !== undefined && idle) s.ty = pose.gy;
    if (pose.jitter) { s.tx += Math.sin(now / 37) * 0.05; s.ty += Math.cos(now / 29) * 0.04; }
    const om = 20 * (ch.omega ?? 1), k = om * om, c = 2 * om;
    s.vx += (k * (s.tx - s.gx) - c * s.vx) * dt; s.vy += (k * (s.ty - s.gy) - c * s.vy) * dt; s.gx += s.vx * dt; s.gy += s.vy * dt;
    const b = 1 - Math.exp(-dt / 0.09); s.px += (s.gx - s.px) * b; s.py += (s.gy - s.py) * b;
    // Моргание.
    if (!pose.sleep && s.blinkT < 0 && now - s.t0 > s.nextBlink) { s.blinkT = 0; }
    if (s.blinkT >= 0) { s.blinkT += dt * 1000; const close = 80, hold = 40, open = 170, t = s.blinkT;
      s.blink = t < close ? t / close : t < close + hold ? 1 : Math.max(0, 1 - (t - close - hold) / open);
      if (t > close + hold + open) { s.blinkT = -1; s.blink = 0; s.t0 = now; const br = ch.blink || [2600, 6800]; s.nextBlink = br[0] + Math.random() * (br[1] - br[0]); } }
    // Выражение: все величины плавно идут к заданным.
    const e = view.fixed ? 1 : 1 - Math.exp(-dt / 0.16), rest = skin.restLid ?? 0.2;
    const tgt = { lt: pose.lt ?? rest, lb: pose.lb ?? 0, pupil: pose.pupil ?? 1, dim: pose.dim ?? 1 };
    for (const key in tgt) s[key] += (tgt[key] - s[key]) * e;
    for (const key of ['mood', 'face', 'pose']) for (let i = 0; i < 4; i++) s[key][i] += (((pose[key] || [0, 0, 0, 0])[i]) - s[key][i]) * e;
    s.wake = Math.max(0, s.wake - dt * 2.2);
    const bob = pose.bob ? Math.sin(now / 55) * 0.035 : 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(canvas.clientWidth * dpr)), h = Math.max(2, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(prog); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(A); gl.vertexAttribPointer(A, 2, gl.FLOAT, false, 0, 0);
    const lidT = Math.min(1, Math.max(s.blink, s.lt) + Math.max(0, s.gy) * 0.16 - Math.max(0, -s.gy) * 0.03 + bob);
    const lidB = Math.max(s.blink * 0.9, s.lb);
    gl.uniform1f(loc.uTime, now / 1000); gl.uniform2f(loc.uSize, w, h); gl.uniform1f(loc.uUnit, Math.min(h / 2.7, w / 5.7));
    gl.uniform1f(loc.uPupil, s.pupil); gl.uniform2f(loc.uGaze, s.gx, s.gy); gl.uniform2f(loc.uGaze2, s.px, s.py);
    gl.uniform1f(loc.uLidTop, Math.max(0, lidT)); gl.uniform1f(loc.uLidBot, lidB);
    gl.uniform1f(loc.uEnergy, 0); gl.uniform1f(loc.uWake, s.wake); gl.uniform1f(loc.uPulse, 0); gl.uniform2f(loc.uPulseDir, 1, 0);
    gl.uniform1f(loc.uDim, s.dim); gl.uniform1f(loc.uLight, view.variant === 'light' ? 1 : 0);
    v.colors.forEach((col, i) => gl.uniform4fv(loc['uC' + i], hex(col)));
    gl.uniform4fv(loc.uP0, v.p0 || [0, 0, 0, 0]); gl.uniform4fv(loc.uP1, v.p1 || [0, 0, 0, 0]);
    gl.uniform4fv(loc.uMood, s.mood); gl.uniform4fv(loc.uFace, s.face); gl.uniform4fv(loc.uPose, s.pose);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
  eye.wake = () => { s.wake = 1; };
  return eye;
}

const main = document.getElementById('main'), eyes = [];
document.getElementById('title').textContent = PAGE.title; document.getElementById('intro').textContent = PAGE.intro; document.title = PAGE.title;
for (const view of VIEWS) {
  if (view.ref && !WALLS[view.ref]) continue;                 // образца нет в папке с картинками: карточку не показываем
  const card = document.createElement('section'); card.className = 'card' + (view.wide ? ' wide' : '');
  card.innerHTML = '<h2></h2><p></p><div class="desk">' + (view.ref ? '' : '<canvas></canvas>') + '</div>';
  card.children[0].textContent = view.title; card.children[1].textContent = view.note;
  const desk = card.children[2];
  if (view.ref) { desk.style.backgroundImage = 'url(' + WALLS[view.ref] + ')'; main.append(card); continue; }
  if (view.wall && WALLS[view.wall]) desk.style.backgroundImage = 'url(' + WALLS[view.wall] + ')'; else desk.style.background = view.color || '#000';
  main.append(card);
  const eye = Eye(desk.firstChild, view); if (eye) eyes.push(eye);
}
const bar = document.getElementById('poses');
for (const name of (PAGE.poses || Object.keys(POSES))) {
  const b = document.createElement('button'); b.textContent = name; b.setAttribute('aria-pressed', String(name === 'Покой'));
  b.onclick = () => { const was = current; current = POSES[name]; for (const x of bar.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    if (was.sleep && !current.sleep) eyes.forEach(e => e.wake()); };
  bar.append(b);
}
if (QS.has('pose') && POSES[QS.get('pose')]) current = POSES[QS.get('pose')];
if (QS.has('sheet') || QS.has('zoom')) document.body.classList.add('sheet');
{ const z = document.createElement('button'); z.textContent = 'Крупно'; z.style.marginLeft = '18px'; z.setAttribute('aria-pressed', String(document.body.classList.contains('sheet')));
  z.onclick = () => z.setAttribute('aria-pressed', String(document.body.classList.toggle('sheet'))); bar.append(z); }
let last = performance.now();
(function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (const e of eyes) e.frame(now, dt); requestAnimationFrame(loop); })(last);
</script>
</body>
</html>
