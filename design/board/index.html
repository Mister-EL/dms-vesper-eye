"", "primary", "", "", "outline", "", "primary"], "variants": {"dark": {"title": "Ночь", "page": {"bg": "#000000", "surface": "#0E0E10", "text": "#F4F4F5", "muted": "#A1A1AA", "a1": "#3DFF6E", "a2": "#D4D4D8", "a3": "#8E8E96", "outline": "#5E5E66"}, "colors": ["#F4F4F5", "#000000", "#3DFF6E", "#000000", "#FFFFFF", "#6B6B73", "#000000", "#1F8A3C"]}, "light": {"title": "Бумага", "page": {"bg": "#EDEDEE", "surface": "#FFFFFF", "text": "#0B0B0C", "muted": "#55555C", "a1": "#008A34", "a2": "#3F3F46", "a3": "#71717A", "outline": "#8A8A93"}, "colors": ["#0B0B0C", "#FFFFFF", "#3DFF6E", "#0B0B0C", "#FFFFFF", "#8A8A93", "#EDEDEE", "#1F8A3C"]}}}, "neon": {"title": "Неон-нуар", "note": "Киберпанк: оптический имплант с диафрагмой. Циан и маджента на чёрном стекле.", "shader": "neon", "irisRadius": 0.74, "restLid": 0.0, "motion": {"omega": 26, "blinkClose": 70, "blinkHold": 30, "blinkOpen": 150}, "themeMap": ["", "secondary", "primary", "tertiary", "", "", "", ""], "variants": {"dark": {"title": "Ночной город", "page": {"bg": "#05030A", "surface": "#0E0818", "text": "#ECE8FF", "muted": "#A99FD0", "a1": "#FF3D9A", "a2": "#2DE2FF", "a3": "#FFE45C", "outline": "#5B4A86"}, "colors": ["#0E0818", "#2DE2FF", "#FF3D9A", "#8A5CFF", "#FFE45C", "#FF2D55", "#0B0714", "#2A2148"]}}}, "eclipse": {"title": "Затмение", "note": "Полное солнечное затмение: чёрный диск Луны, жемчужная корона и серп Солнца при взгляде в сторону.", "shader": "eclipse", "irisRadius": 0.9, "restLid": 0.08, "motion": {"omega": 14, "blinkClose": 130, "blinkHold": 50, "blinkOpen": 280}, "themeMap": ["", "", "primary", "", "", "", "tertiary", ""], "variants": {"dark": {"title": "Полная фаза", "page": {"bg": "#000000", "surface": "#0A0B10", "text": "#F1EEE6", "muted": "#A5A7B5", "a1": "#F3DDAA", "a2": "#FF6F8B", "a3": "#9DB4FF", "outline": "#5F6274"}, "colors": ["#F6F1E7", "#F3DDAA", "#FF5E7E", "#0B1020", "#020308", "#000000", "#9DB4FF", "#04050A"]}}}, "vesper": {"title": "Веспер", "note": "Прежний готический вид: винный гранат, кость и потемневшая латунь.", "shader": "vesper", "irisRadius": 0.92, "restLid": 0.1, "motion": {"omega": 20, "blinkClose": 95, "blinkHold": 30, "blinkOpen": 175}, "themeMap": ["", "", "", "primary", "secondary", "", "surface", "primary"], "variants": {"dark": {"title": "Sanguine Ivory", "page": {"bg": "#0D0B10", "surface": "#17121A", "text": "#E8DDCF", "muted": "#B6A6B1", "a1": "#CC6B7C", "a2": "#C6A36D", "a3": "#A28DB8", "outline": "#796572"}, "colors": ["#D2C4AE", "#6B5960", "#2A0F1A", "#8A324C", "#C6A36D", "#08070B", "#17121A", "#CC6B7C"]}}}}, "shaders": {"eclipse": "#version 300 es\nprecision highp float;\nin vec2 vUv;\nout vec4 fragColor;\nuniform float uTime;\nuniform vec2 uSize;\nuniform float uUnit;\nuniform float uPupil;\nuniform vec2 uGaze;\nuniform vec2 uGaze2;\nuniform float uLidTop;\nuniform float uLidBot;\nuniform float uEnergy;\nuniform float uWake;\nuniform float uPulse;\nuniform float uDim;\nuniform vec2 uPulseDir;\nuniform float uLight;\nuniform vec4 uC0;\nuniform vec4 uC1;\nuniform vec4 uC2;\nuniform vec4 uC3;\nuniform vec4 uC4;\nuniform vec4 uC5;\nuniform vec4 uC6;\nuniform vec4 uC7;\nuniform vec4 uP0;\nuniform vec4 uP1;\n\n// Общая геометрия и утилиты. Координаты q — в «единицах глаза»:\n// 1 единица = половина высоты раскрытого глаза (uUnit пикселей), ось y направлена вниз.\n// Цвет на выходе eye() — с предумноженной альфой.\n#define PI 3.14159265\n#define TAU 6.28318531\n\n// Рамка глаза одна для всех образов: полуширина раскрытия в единицах.\n#define EYE_W 2.5\n// Радиус глазного яблока: от него зависит, насколько радужка сплющивается при взгляде в сторону.\n#define EYE_R 2.5\n\nfloat hash11(float n) { return fract(sin(n * 127.1) * 43758.5453); }\nfloat hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nvec2 hash22(vec2 p) {\n    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);\n}\nfloat vnoise(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),\n               mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);\n}\n// Шум, замкнутый по x с периодом period: для узоров по углу без шва.\nfloat vnoiseWrap(vec2 p, float period) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float x0 = mod(i.x, period), x1 = mod(i.x + 1.0, period);\n    return mix(mix(hash21(vec2(x0, i.y)), hash21(vec2(x1, i.y)), f.x),\n               mix(hash21(vec2(x0, i.y + 1.0)), hash21(vec2(x1, i.y + 1.0)), f.x), f.y);\n}\nmat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }\n\n// Ширина одного пикселя в единицах глаза и покрытие для сглаживания краёв.\nfloat px() { return 1.0 / max(uUnit, 1.0); }\nfloat cover(float d) { float w = px(); return 1.0 - smoothstep(-w, w, d); }\nfloat coverSoft(float d, float w) { return 1.0 - smoothstep(-w, w, d); }\n// Линия полуширины hw вокруг d = 0.\nfloat stroke(float d, float hw) { return cover(abs(d) - hw); }\n\nfloat sdSegment(vec2 p, vec2 a, vec2 b) {\n    vec2 pa = p - a, ba = b - a;\n    return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0));\n}\nfloat sdRoundBox(vec2 p, vec2 b, float r) {\n    vec2 d = abs(p) - b + vec2(r);\n    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;\n}\n\n// Кромка века — дуга окружности через оба уголка (±wi, 0) с вершиной в (0, k).\n// Возвращает расстояние со знаком: больше нуля ниже дуги (y направлена вниз).\nfloat arcBelow(vec2 q, float wi, float k) {\n    if (abs(k) < 0.002) return q.y - k;\n    float rad = (wi * wi + k * k) / (2.0 * abs(k));\n    float cy = k < 0.0 ? k + rad : k - rad;\n    float d = length(vec2(q.x, q.y - cy)) - rad;\n    return k < 0.0 ? -d : d;\n}\n\n// Точное расстояние до линзы из двух дуг: верхняя с вершиной -hu, нижняя с вершиной +hl.\nfloat sdLens(vec2 q, float wi, float hu, float hl) {\n    float ru = (wi * wi + hu * hu) / (2.0 * hu), rl = (wi * wi + hl * hl) / (2.0 * hl);\n    float cu = -hu + ru, cl = hl - rl;                 // центры: верхней дуги — ниже, нижней — выше\n    vec2 a = vec2(abs(q.x), q.y);\n    float d = max(length(vec2(a.x, a.y - cu)) - ru, length(vec2(a.x, a.y - cl)) - rl);\n    // За уголком ближайшая точка — сам уголок.\n    vec2 v = a - vec2(wi, 0.0);\n    vec2 nu = vec2(wi, -cu), nl = vec2(wi, -cl);       // нормали дуг в уголке\n    if (nu.x * v.y - nu.y * v.x > 0.0 && v.x * nl.y - v.y * nl.x > 0.0) d = length(v);\n    return d;\n}\n\n// Силуэт глаза и раскрытие между веками. Все расстояния — в единицах глаза.\n//   dShape < 0 внутри силуэта;\n//   dTop > 0 ниже кромки верхнего века, dBot > 0 выше кромки нижнего (то есть в раскрытой части).\n// rnd скругляет уголки; closeY — где смыкаются веки (ниже центра).\nvoid eyeGeom(vec2 q, float hU, float hL, float rnd, float closeY,\n             out float dShape, out float dTop, out float dBot) {\n    float wi = EYE_W - rnd, hu = hU - rnd, hl = hL - rnd;\n    dShape = sdLens(q, wi, hu, hl) - rnd;\n    float lt = clamp(uLidTop, 0.0, 1.0), lb = clamp(uLidBot, 0.0, 1.0);\n    dTop = arcBelow(q, wi, mix(-hu, closeY, lt)) + rnd * (1.0 - lt);\n    dBot = -arcBelow(q, wi, mix(hl, closeY, lb)) + rnd * (1.0 - lb);\n}\n\n// Центр радужки на экране для направления взгляда g из [-1, 1].\nvec2 irisCenter(vec2 g, vec2 travel, float y0) { return vec2(g.x * travel.x, g.y * travel.y + y0); }\n\n// Координаты точки в плоскости радужки (в её радиусах): яблоко — шар,\n// поэтому при взгляде в сторону диск сплющивается вдоль направления взгляда.\nvec2 irisUV(vec2 q, vec2 c, float rI) {\n    vec2 v = q - c;\n    float cl = length(c);\n    if (cl > 1e-4) {\n        vec2 d = c / cl;\n        float s = sqrt(max(0.2, 1.0 - cl * cl / (EYE_R * EYE_R)));\n        float par = dot(v, d);\n        v += d * (par / s - par);\n    }\n    return v / rI;\n}\n\n// Наложение источника с предумноженной альфой поверх накопленного цвета.\nvec4 over(vec4 dst, vec3 rgb, float a) { return vec4(dst.rgb * (1.0 - a) + rgb * a, dst.a * (1.0 - a) + a); }\n\n// «Затмение»: полное солнечное затмение как глаз неба. Зрачок — диск Луны, радужка — корона. Цвета:\n//   uC0 корона (жемчужный белый), uC1 золото: Солнце, «бриллиантовое кольцо» и тепло у края диска,\n//   uC2 хромосфера и протуберанцы, uC3 небо возле Солнца (индиго), uC4 небо в уголках (почти чёрное),\n//   uC5 диск Луны, uC6 холодный оттенок: дальняя корона, звёзды, отсвет по силуэту, uC7 веки (тень).\n// Солнце стоит в центре радужки; Луна чуть больше и съезжает по взгляду, открывая серп с обратной стороны.\nconst float EC_RI = 0.90;      // радиус радужки в единицах глаза\nconst float EC_R0 = 0.40;      // радиус Солнца в радиусах радужки при uPupil = 1\nconst float EC_MOON = 1.045;   // во сколько раз Луна больше Солнца\nconst float EC_TILT = -0.14;   // наклон солнечного экватора, рад\n\n// Расстояние по углу, угол в оборотах.\nfloat ecArc(float a) { return abs(fract(a + 0.5) - 0.5); }\n\n// Длинный стример: ось a0 (обороты), изгиб bend, полуширина у основания wid, длина затухания len (в радиусах Солнца).\n// Основание широкое, дальше луч сходится в остриё.\nfloat ecStreamer(float an, float x, float a0, float bend, float wid, float len) {\n    float d = ecArc(an - a0 - bend * x / (1.0 + x));\n    float w = wid * (0.04 + 0.96 / pow(1.0 + x, 1.6));\n    return exp(-d * d / (w * w)) * exp(-x / len);\n}\n\n// Протуберанец: язычок над краем Солнца. h — высота над краем в радиусах радужки.\nfloat ecProm(float an, float h, float a0, float wid, float height) {\n    float d = ecArc(an - a0 - h * 0.3);\n    float k = h / height;\n    return exp(-d * d / (wid * wid)) * exp(-k * k);\n}\n\n// Неподвижные звёзды: не больше одной на ячейку, яркость разная.\nfloat ecStars(vec2 q, float cell, float seed, float keep) {\n    vec2 g = q / cell + vec2(seed, seed * 1.7);\n    vec2 id = floor(g);\n    float sel = hash21(id + vec2(seed * 3.1, 5.3));\n    if (sel < keep) return 0.0;\n    float b = (sel - keep) / (1.0 - keep);\n    vec2 p = (fract(g) - (0.22 + 0.56 * hash22(id + vec2(1.7, seed)))) * cell;\n    float sr = max(0.010, 1.05 * px()) * (0.75 + 0.6 * b);\n    float tw = 1.0 + 0.22 * sin(uTime * (1.3 + 2.0 * b) + sel * 40.0);\n    float s = exp(-dot(p, p) / (sr * sr));\n    // У самых ярких — мягкий ореол.\n    s += smoothstep(0.70, 1.0, b) * 0.22 * exp(-length(p) / (2.2 * sr));\n    return s * (0.10 + 0.90 * b * b) * tw;\n}\n\nvec4 eye(vec2 q) {\n    float dShape, dTop, dBot;\n    eyeGeom(q, 1.0, 0.88, 0.05, 0.24, dShape, dTop, dBot);\n    float w = px();\n    float aw = 1.2 * w / EC_RI;\n    float pup = clamp(uPupil, 0.6, 1.6);\n    float energy = clamp(uEnergy, 0.0, 1.0);\n    float wake = clamp(uWake, 0.0, 1.0);\n\n    // Солнце — в центре радужки.\n    vec2 c = irisCenter(uGaze, vec2(1.05, 0.30), -0.07);\n    vec2 u = irisUV(q, c, EC_RI);\n    float r = length(u);\n    float rs = EC_R0 * pup, rm = rs * EC_MOON;\n    // Луна: сдвиг по запаздывающему взгляду и на долю самого взгляда; при пробуждении диск на миг съезжает.\n    vec2 mOff = uGaze2 * vec2(0.036, 0.031) + uGaze * vec2(0.028, 0.024) + wake * vec2(0.046, 0.037);\n    float dm = length(u - mOff) - rm;\n\n    // --- Корона ---\n    float ang = atan(u.y, u.x + 1e-5) - EC_TILT;   // сдвиг: в самом центре угол не определён\n    float an = ang / TAU + 0.5;\n    float x = max(r - rs, 0.0) / EC_R0;           // высота над краем Солнца в его радиусах\n    float xf = x / (1.0 + x);\n    float eq = cos(ang); eq *= eq;                // 1 на экваторе, 0 на полюсах\n    // Силовые линии: от полюсов лучи расходятся к экватору.\n    float an0 = an + 0.050 * sin(2.0 * ang) * xf;\n    float drift = uTime * 0.02;\n    float pxa = r * EC_RI * TAU / w;              // пикселей в окружности на этом радиусе\n    float env = vnoiseWrap(vec2(an0 * 7.0, 1.3), 7.0);\n    float env2 = vnoiseWrap(vec2(an0 * 17.0, 4.1 + x * 0.15), 17.0);\n    float n1 = vnoiseWrap(vec2(an0 * 40.0, x * 0.50 + 2.0 - drift), 40.0);\n    float n2 = mix(0.5, vnois * nl.x > 0.0) d = length(v);\n    return d;\n}\n\n// Силуэт глаза и раскрытие между веками. Все расстояния — в единицах глаза.\n//   dShape < 0 внутри силуэта;\n//   dTop > 0 ниже кромки верхнего века, dBot > 0 выше кромки нижнего (то есть в раскрытой части).\n// rnd скругляет уголки; closeY — где смыкаются веки (ниже центра).\nvoid eyeGeom(vec2 q, float hU, float hL, float rnd, float closeY,\n             out float dShape, out float dTop, out float dBot) {\n    float wi = EYE_W - rnd, hu = hU - rnd, hl = hL - rnd;\n    dShape = sdLens(q, wi, hu, hl) - rnd;\n    float lt = clamp(uLidTop, 0.0, 1.0), lb = clamp(uLidBot, 0.0, 1.0);\n    dTop = arcBelow(q, wi, mix(-hu, closeY, lt)) + rnd * (1.0 - lt);\n    dBot = -arcBelow(q, wi, mix(hl, closeY, lb)) + rnd * (1.0 - lb);\n}\n\n// Центр радужки на экране для направления взгляда g из [-1, 1].\nvec2 irisCenter(vec2 g, vec2 travel, float y0) { return vec2(g.x * travel.x, g.y * travel.y + y0); }\n\n// Координаты точки в плоскости радужки (в её радиусах): яблоко — шар,\n// поэтому при взгляде в сторону диск сплющивается вдоль направления взгляда.\nvec2 irisUV(vec2 q, vec2 c, float rI) {\n    vec2 v = q - c;\n    float cl = length(c);\n    if (cl > 1e-4) {\n        vec2 d = c / cl;\n        float s = sqrt(max(0.2, 1.0 - cl * cl / (EYE_R * EYE_R)));\n        float par = dot(v, d);\n        v += d * (par / s - par);\n    }\n    return v / rI;\n}\n\n// Наложение источника с предумноженной альфой поверх накопленного цвета.\nvec4 over(vec4 dst, vec3 rgb, float a) { return vec4(dst.rgb * (1.0 - a) + rgb * a, dst.a * (1.0 - a) + a); }\n\n// «Неон-нуар»: оптический имплант. Тёмное стекло, диафрагма из восьми лепестков, тонкий неон. Цвета:\n//   uC0 стекло «белка», uC1 циан (нить контура, кольцо, деления, кромки лепестков, блик),\n//   uC2 маджента (внешний контур с разрывами, дуга взгляда, сканер события), uC3 фиолетовый (сетка, отсветы, фаски),\n//   uC4 жёлтый (только микродетали), uC5 лазер (точка в зрачке, огонёк сна),\n//   uC6 бр )))) * 43758.5453);\n}\nfloat vnoise(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),\n               mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);\n}\n// Шум, замкнутый по x с периодом period: для узоров по углу без шва.\nfloat vnoiseWrap(vec2 p, float period) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float x0 = mod(i.x, period), x1 = mod(i.x + 1.0, period);\n    return mix(mix(hash21(vec2(x0, i.y)), hash21(vec2(x1, i.y)), f.x),\n               mix(hash21(vec2(x0, i.y + 1.0)), hash21(vec2(x1, i.y + 1.0)), f.x), f.y);\n}\nmat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }\n\n// Ширина одного пикселя в единицах глаза и покрытие для сглаживания краёв.\nfloat px() { return 1.0 / max(uUnit, 1.0); }\nfloat cover(float d) { float w = px(); return 1.0 - smoothstep(-w, w, d); }\nfloat coverSoft(float d, float w) { return 1.0 - smoothstep(-w, w, d); }\n// Линия полуширины hw вокруг d = 0.\nfloat stroke(float d, float hw) { return cover(abs(d) - hw); }\n\nfloat sdSegment(vec2 p, vec2 a, vec2 b) {\n    vec2 pa = p - a, ba = b - a;\n    return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0));\n}\nfloat sdRoundBox(vec2 p, vec2 b, float r) {\n    vec2 d = abs(p) - b + vec2(r);\n    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;\n}\n\n// Кромка века — дуга окружности через оба уголка (±wi, 0) с вершиной в (0, k).\n// Возвращает расстояние со знаком: больше нуля ниже дуги (y направлена вниз).\nfloat arcBelow(vec2 q, float wi, float k) {\n    if (abs(k) < 0.002) return q.y - k;\n    float rad = (wi * wi + k * k) / (2.0 * abs(k));\n    float cy = k < 0.0 ? k + rad : k - rad;\n    float d = length(vec2(q.x, q.y - cy)) - rad;\n    return k < 0.0 ? -d : d;\n}\n\n// Точное расстояние до линзы из двух дуг: верхняя с вершиной -hu, нижняя с вершиной +hl.\nfloat sdLens(vec2 а с предумноженной альфой поверх накопленного цвета.\nvec4 over(vec4 dst, vec3 rgb, float a) { return vec4(dst.rgb * (1.0 - a) + rgb * a, dst.a * (1.0 - a) + a); }\n\n// «Связи»: глаз — объёмный шар из узлов и связей. От зрачка связи расходятся деревом,\n// за краем радужки сходятся к заднему полюсу; задняя половина шара просвечивает сквозь переднюю.\n// Цвета: uC0 связи, uC1 узлы, uC2 ядро и пакеты (янтарь), uC3 редкие узлы (мята),\n//        uC4 дымка радужки, uC5 линии век, uC6 дальняя половина шара, uC7 свет на краю шара.\n// Сигналы: uP0.x сеть есть (1) или нет (0), uP0.y защищённый канал, uP0.z активный рабочий стол (с 1),\n//          uP0.w сколько рабочих столов (0 — цепочку не рисовать).\nconst float NX_R = 0.98;          // радиус шара в единицах глаза\nconst float NX_PUPIL = 0.20;      // угловой радиус зрачка, радианы\nconst float NX_LIMB = 0.62;       // край радужки\n\n// Кольца шара: угол от полюса взгляда и число узлов. До края радужки узлов вдвое больше\n// на каждом шаге, дальше — вдвое меньше, пока все связи не сойдутся в заднем полюсе.\nvoid nxRing(float k, out float th, out float n) {\n    if (k < 0.5) { th = NX_PUPIL; n = 8.0; }\n    else if (k < 1.5) { th = 0.34; n = 16.0; }\n    else if (k < 2.5) { th = 0.48; n = 32.0; }\n    else if (k < 3.5) { th = NX_LIMB; n = 32.0; }\n    else if (k < 4.5) { th = 0.98; n = 16.0; }\n    else if (k < 5.5) { th = 1.45; n = 8.0; }\n    else if (k < 6.5) { th = 2.05; n = 4.0; }\n    else if (k < 7.5) { th = 2.70; n = 2.0; }\n    else { th = PI; n = 1.0; }\n}\n\n// Узел кольца k с номером i как точка на единичной сфере (ось z — взгляд).\nvec3 nxNode(float k, float i) {\n    float th, n;\n    nxRing(k, th, n);\n    i = mod(i, n);\n    vec2 h = hash22(vec2(k * 7.3 + 1.0, i + 3.7));\n    if (k > 3.5 && k < 7.5) th += (h.x - 0.5) * 0.10;                 // за радужкой сеть свободнее\n    float ph = (i + 0.5) * TAU / n + (h.y - 0.5) * (k > 3.5 ? 0.30 : 0.10) * TAU / n;\n    float s = sin(th);\n    return vec3(s * cos(ph), s * sin(ph), cos(th));\n}\n\n// Состояние текущего пикселя: оси шара в пространстве экрана, точка на диске и глубина со знаком.\nvec3 gAx, gAy, gPole;\nvec2 gD;\nfloat gZ;\n\nvec3 nxView(vec3 l) { return gAx * l.x + gAy * l.y + gPole * l.z; }\n\n// Расстояние на экране (в радиусах шара) от пикселя до дуги большого круга a–b.\n// Делится на длину экранного градиента, поэтому нить одной толщины и в центре, и у края шара.\nfloat nxArc(vec3 p, vec3 a, vec3 b) {\n    vec3 n = cross(a, b);\n    float ln = length(n);\n    if (ln < 1e-4) return 1e3;\n    n /= ln;\n    if (dot(cross(a, p), n) < 0.0 || dot(cross(p, b), n) < 0.0) return 1e3;   // концы дуги закрыты узлами\n    vec3 nv = nxView(n);\n    vec2 g = nv.xy - nv.z * gD / gZ;\n    return abs(dot(p, n)) / max(length(g), 0.08);\n}\n// Расстояние на экране до узла; узел с другой стороны шара не виден.\nfloat nxDot(vec3 a) {\n    vec3 v = nxView(a);\n    return v.z * gZ > 0.0 ? length(v.xy - gD) : 1e3;\n}\n// Расстояние на экране до кольца с углом th от полюса.\nfloat nxCircle(vec3 p, float th) {\n    float t = acos(clamp(p.z, -1.0, 1.0));\n    vec2 g = gPole.xy - gPole.z * gD / gZ;\n    return abs(t - th) * max(sin(t), 0.05) / max(length(g), 0.08);\n}\n\n// Сеть в точке p сферы: x — связи, y — узлы, z — редкие мятные узлы. hw — полуширина нити на экране.\nvec3 nxWeb(vec3 p, float hw) {\n    float th = acos(clamp(p.z, -1.0, 1.0));\n    float ph = atan(p.y, p.x);\n    if (ph < 0.0) ph += TAU;\n    float k = 0.0;\n    float tA, nA, tB, nB;\n    for (int j = 0; j < 8; j++) {\n        nxRing(float(j) + 1.0, tB, nB);\n        if (th > tB) k = float(j) + 1.0;\n    }\n    k = min(k, 7.0);\n    nxRing(k, tA, nA);\n    nxRing(k + 1.0, tB, nB);\n    float link = 0.0, node = 0.0, mint = 0.0;\n    if (th >= NX_PUPIL - 0.03) {\n        float d = 1e3;\n        if (nA == nB) {\n            float i = floor(ph / (TAU / nA));\n            d = nxArc(p, nxNode(k, i), nxNode(k + 1.0, i));\n        } else {\n            bool fanOut = nB > nA;\n            float nc = fanOut ? nA : nB;\n            float kc = fanOut ? k : k + 1.0, kf = fanOut ? k + 1.0 : k;\n            float i = floor(ph / (TAU / nc));\n            vec3 c = nxNode(kc, i), f0 = nxNode(kf, 2.0 * i), f1 = nxNode(kf, 2.0 * i + 1.0);\n            // Дуга ориентирована от меньшего угла к большему, чтобы проверка «внутри дуги» работала в обе стороны.\n            d = fanOut ? min(nxArc(p, c, f0), nxArc(p, c, f1)) : min(nxArc(p, f0, c), nxArc(p, f1, c));\n        }\n        link = 1.0 - smoothstep(hw, hw + px() / NX_R, d);\n        float face = 0.45 + 0.55 * abs(gZ);\n        for (int s = 0; s < 2; s++) {\n            float kk = k + float(s);\n            float tt, nn;\n            nxRing(kk, tt, nn);\n            float ii = floor(ph / (TAU / nn));\n            float h = hash21(vec2(kk * 3.1, mod(ii, nn) + 9.0));\n            float rad = (kk < 3.5 ? 0.013 : 0.019) * (0.8 + 0.5 * h) * (1.0 + 0.6 * uEnergy) * face;\n            float m = 1.0 - smoothstep(rad - 0.5 * px() / NX_R, rad + 0.5 * px() / NX_R, nxDot(nxNode(kk, ii)));\n            node = max(node, m);\n            if (h > 0.93) mint = max(mint, m);\n        }\n    }\n    return vec3(link, node, mint);\n}\n\nvec4 eye(vec2 q) {\n    float dShape, dTop, dBot;\n    eyeGeom(q, 1.0, 0.88, 0.0, 0.24, dShape, dTop, dBot);\n    float w = px();\n    float open = cover(-min(dTop, dBot));\n    float online = mix(0.45, 1.0, clamp(uP0.x, 0.0, 1.0));\n    vec4 col = vec4(0.0);\n\n    // Шар и его поворот: полюс смотрит туда же, куда глаз.\n    vec2 c0 = vec2(0.0, -0.04);\n    float yaw = uGaze.x * 0.62, pitch = uGaze.y * 0.42;\n    vec3 pole = vec3(sin(yaw) * cos(pitch), sin(pitch), cos(yaw) * cos(pitch));\n    vec3 ax = normalize(cross(vec3(0.0, 1.0, 0.0), pole));\n    vec3 ay = cross(pole, ax);\n    vec2 d = (q - c0) / NX_R;\n    float rr = dot(d, d);\n\n    if (rr < 1.0) {\n        float z = sqrt(1.0 - rr);\n        float hw = 0.55 * w / NX_R;\n        vec3 nf = vec3(d, z), nb = vec3(d, -z);\n        gAx = ax; gAy = ay; gPole = pole; gD = d;\n        // Тело шара: чуть темнее фона, чтобы сеть читалась и на обоях.\n        col = over(col, vec3(0.0), 0.34 * smoothstep(0.0, 0.25, z));\n        // Дальняя половина: тоньше, тише и холоднее; у края шара гаснет.\n        gZ = -max(z, 0.02);\n        vec3 pb = vec3(dot(nb, ax), dot(nb, ay), dot(nb, pole));\n        vec3 back = nxWeb(pb, hw * 0.8);\n        float fb = (0.05 + 0.22 * z) * online;\n        col = over(col, uC6.rgb, back.x * fb);\n        col = over(col, uC6.rgb, back.y * fb * 1.8);\n        // Ближняя половина.\n        gZ = max(z, 0.02);\n        vec3 pf = vec3(dot(nf, ax), dot(nf, ay), dot(nf, pole));\n        vec3 front = nxWeb(pf, hw);\n        float thF = acos(clamp(pf.z, -1.0, 1.0));\n        float iris = 1.0 - smoothstep(NX_LIMB - 0.01, NX_LIMB + 0.01, thF);\n        col = over(col, uC4.rgb, iris * (0.07 + 0.11 * smoothstep(NX_PUPIL, NX_LIMB, thF)));\n        float pupil = 1.0 - smoothstep(NX_PUPIL - 0.012, NX_PUPIL + 0.004, thF);\n        col = over(col, vec3(0.0), pupil * 0.5);\n        float wave = uWake > 0.001 ? exp(-pow((thF - (1.0 - uWake) * 2.2) / 0.18, 2.0)) * uWake : 0.0;\n        float fl = (mix(0.30, 0.66, iris) + 0.22 * z + 1.4 * wave) * online * smoothstep(0.0, 0.18, z);\n        col = over(col, mix(uC0.rgb, uC1.rgb, wave), front.x * clamp(fl, 0.0, 1.0));\n        // Кольца: зрачок и край радужки сплошные; второй контур — когда канал защищён.\n        float e = px() / NX_R;\n        float rings = (1.0 - smoothstep(hw * 1.3, hw * 1.3 + e, nxCircle(pf, NX_PUPIL))) * 0.95;\n        rings = max(rings, (1.0 - smoothstep(hw * 1.2, hw * 1.2 + e, nxCircle(pf, NX_LIMB))) * 0.66);\n        rings = max(rings, (1.0 - smoothstep(hw * 0.7, hw * 0.7 + e, nxCircle(pf, 0.34))) * 0.15);\n        rings = max(rings, (1.0 - smoothstep(hw * 0.7, hw * 0.7 + e, nxCircle(pf, 0.48))) * 0.15);\n        rings = max(rings, (1.0 - smoothstep(hw, hw + e, nxCircle(pf, NX_LIMB + 0.06))) * 0.5 * clamp(uP0.y, 0.0, .85), cover(pd - 0.022));\n    }\n\n    col *= open;\n\n    // Растяжки от шара к уголкам глаза: держат шар и натягиваются при повороте.\n    for (int i = 0; i < 3; i++) {\n        float a = (float(i) - 1.0) * 0.55;\n        vec3 l1 = vec3(sin(1.22) * cos(a), sin(1.22) * sin(a), cos(1.22));\n        vec3 l2 = vec3(-l1.x, l1.y, l1.z);\n        vec3 v1 = ax * l1.x + ay * l1.y + pole * l1.z, v2 = ax * l2.x + ay * l2.y + pole * l2.z;\n        vec2 e1 = c0 + NX_R * v1.xy, e2 = c0 + NX_R * v2.xy;\n        vec2 k1 = vec2(EYE_W, 0.0), k2 = vec2(-EYE_W, 0.0);\n        if (uP0.x < 0.5) { k1 = mix(e1, k1, 0.55); k2 = mix(e2, k2, 0.55); }   // сети нет — растяжки оборваны\n        float t1 = (1.0 - smoothstep(0.4 * w, 1.4 * w, sdSegment(q, e1, k1))) * (v1.z > 0.0 ? 0.42 : 0.14);\n        float t2 = (1.0 - smoothstep(0.4 * w, 1.4 * w, sdSegment(q, e2, k2))) * (v2.z > 0.0 ? 0.42 : 0.14);\n        // Нить от узла на ближней стороне видна целиком; от узла за шаром — только снаружи.\n        float outside = smoothstep(0.98, 1.02, sqrt(rr));\n        t1 *= v1.z > 0.0 ? 1.0 : outside;\n        t2 *= v2.z > 0.0 ? 1.0 : outside;\n        col = over(col, uC0.rgb, max(t1, t2) * open * online);\n        col = over(col, uC1.rgb, max(cover(length(q - e1) - 0.02) * step(0.0, v1.z), cover(length(q - e2) - 0.02) * step(0.0, v2.z)) * open);\n    }\n\n    // Веки: две тонкие дуги с узлами в уголках; во сне остаётся одна линия и тёплая точка.\n    float inside = cover(dShape - 2.0 * w);\n    float lids = max(stroke(dTop, 0.55 * w), stroke(dBot, 0.55 * w)) * inside;\n    col = over(col, uC5.rgb, lids * 0.55);\n    float corner = cover(length(vec2(abs(q.x) - EYE_W, q.y)) - 0.03);\n    col = over(col, uC1.rgb, corner);\n    float closed = smoothstep(0.9, 1.0, uLidTop) * smoothstep(0.9, 1.0, uLidBot);\n    float sd = length(q - vec2(0.0, 0.24));\n    col.rgb += uC2.rgb * exp(-sd / 0.05) * 0.8 * closed;\n    col = over(col, uC2.rgb, cover(sd - 0.026) * closed);\n\n    // Рабочие столы: цепочка узлов по   function select(id) { current = id; stage.skinId = id; if (!DATA.skins[id].variants[variant]) variant = 'dark'; paint(); }

    const s = DATA.skins[current], v = s.variants[variant], pg = v.page; stage.variant = variant;
    for (const [k, val] of Object.entries(pg)) document.documentElement.style.setProperty('--' + k, val);
    for (const b of tabs.children) b.setAttribute('aria-pressed', String(b.dataset.id === current));
    const other = variant === 'dark' ? 'light' : 'dark'; const vb = document.getElementById('variant');
    vb.hidden = !s.variants[other]; vb.textContent = 'Вариант: ' + v.title;
    document.getElementById('skinnote').textContent = s.note;
    const sw = document.getElementById('swatches'); sw.textContent = '';
    const names = { bg: 'Фон', surface: 'Поверхность', text: 'Текст', muted: 'Приглушённый', a1: 'Акцент 1', a2: 'Акцент 2', a3: 'Акцент 3', outline: 'Рамка' };
    for (const [k, val] of Object.entries(pg)) { const d = document.createElement('div'); d.className = 'sw'; d.innerHTML = '<i></i><b></b><code></code>';
      d.children[0].style.background = val; d.children[1].textContent = names[k] || k; d.children[2].textContent = val; sw.append(d); }
  }
  document.getElementById('variant').onclick = () => { const o = variant === 'dark' ? 'light' : 'dark'; if (DATA.skins[current].variants[o]) { variant = o; paint(); } };
  document.getElementById('blink').onclick = () => blink(stage);
  document.getElementById('sleep').onclick = e => { const on = !stage.sleep; tween(stage, 'sleep', on ? 1 : 0, on ? 900 : 380, () => { if (!on) { stage.wake = 1; blink(stage); } }); e.target.setAttribute('aria-pressed', String(on)); };
  document.getElementById('notify').onclick = () => { stage.pulse = 0.001; stage.pdx = 0.8; stage.pdy = -0.6; stage.pupilT = 1.12; setTimeout(() => stage.pupilT = 1, 500); };
  const sc = stage.canvas;
  sc.addEventListener('pointerdown', () => tween(stage, 'held', 1, 180)); addEventListener('pointerup', () => stage.held && tween(stage, 'held', 0, 210));
  sc.addEventListener('dblclick', () => { stage.pupilT = 1.3; setTimeout(() => stage.pupilT = 1, 550); });
  (function auto() { setTimeout(() => { eyes.forEach(e => Math.random() < 0.8 && blink(e)); auto(); }, 4000 + Math.random() * 5000); })();
  paint(); let last = performance.now(), acc = 0, frames = 0;
  (function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const e of eyes) { e.step(dt, pointer); e.draw(now); }
    acc += dt; frames++; if (acc > 1) { document.getElementById('meter').textContent = Math.round(frames / acc) + ' кадров в секунду'; acc = 0; frames = 0; }
    requestAnimationFrame(loop); })(last);
}
</script>
