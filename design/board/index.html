#EDE6E0", "muted": "#9A938C", "a1": "#F39C9E", "a2": "#7FD6B2", "a3": "#C9B7AE", "outline": "#3D3532"}, "colors": ["#151410", "#3D3532", "#F39C9E", "#F4EEEE", "#F4EEEE", "#3D3532", "#3D3532", "#F39C9E"]}, "light": {"title": "Светлый", "page": {"bg": "#F1ECE6", "surface": "#FAF7F3", "text": "#221E1B", "muted": "#6E655E", "a1": "#C2535E", "a2": "#2F8A68", "a3": "#7A6257", "outline": "#CFC5BC"}, "colors": ["#F1ECE6", "#DDD3CB", "#EE8C93", "#1F1B19", "#1F1B19", "#DDD3CB", "#DDD3CB", "#EE8C93"]}}}, "archive2": {"title": "Архив II", "note": "Второй глаз, Vesper Eye 0.1, осень 2026 года: костяной белок, гранатовая радужка, тонкий контур. Оставлен на память.", "shader": "archive2", "irisRadius": 0.804, "restLid": 0.04, "shape": {"type": "lens", "w": 2.8, "hu": 0.66, "hl": 0.66}, "character": {"plain": true, "dozeAfter": 120, "drowsyLid": 0.95, "actGap": [9000, 20000], "tempo": 1.0, "omega": 0.8, "lag": 0.02, "blink": [4000, 9000], "blinkKind": "lid", "acts": {"sweep": 1}}, "themeMap": ["", "", "", "", "", "", "", ""], "variants": {"dark": {"title": "Как был", "page": {"bg": "#0D0B10", "surface": "#17121A", "text": "#E8DDCF", "muted": "#B6A6B1", "a1": "#CC6B7C", "a2": "#C6A36D", "a3": "#83AAA1", "outline": "#574650"}, "colors": ["#17121A", "#C3B4A4", "#75263D", "#08070B", "#F6E8DE", "#CFC3BC", "#AA3758", "#451624"]}, "light": {"title": "Светлый", "page": {"bg": "#EDE5DA", "surface": "#F8F3EB", "text": "#1E1519", "muted": "#6F6166", "a1": "#8A2D48", "a2": "#8A6A2F", "a3": "#3F7468", "outline": "#C9BBAE"}, "colors": ["#E2D7CA", "#FBF6EE", "#8A2D48", "#140E12", "#FFF8F0", "#5A4640", "#C24D6E", "#541B2D"]}}}}, "shaders": {"archive1": "#version 300 es\nprecision highp float;\nin vec2 vUv;\nout vec4 fragColor;\nuniform float uTime;\nuniform vec2 uSize;\nuniform float uUnit;\nuniform float uPupil;\nuniform vec2 uGaze;\nuniform vec2 uGaze2;\nuniform float uLidTop;\nuniform float uLidBot;\nuniform float uEnergy;\nuniform float uWake;\nuniform float uPulse;\nuniform float uDim;\nuniform vec2 uPulseDir;\nuniform float uLight;\nuniform vec4 uC0;\nuniform vec4 uC1;\nuniform vec4 uC2;\nuniform vec4 uC3;\nuniform vec4 uC4;\nuniform vec4 uC5;\nuniform vec4 uC6;\nuniform vec4 uC7;\nuniform vec4 uP0;\nuniform vec4 uP1;\nuniform vec4 uMood;\nuniform vec4 uFace;\nuniform vec4 uPose;\n\n// Общая геометрия и утилиты. Координаты q — в «единицах глаза»:\n// 1 единица = половина высоты раскрытого глаза (uUnit пикселей), ось y направлена вниз.\n// Цвет на выходе eye() — с предумноженной альфой.\n#define PI 3.14159265\n#define TAU 6.28318531\n\n// Рамка глаза одна для всех образов: полуширина раскрытия в единицах.\n#define EYE_W 2.5\n// Радиус глазного яблока: от него зависит, насколько радужка сплющивается при взгляде в сторону.\n#define EYE_R 2.5\n\nfloat hash11(float n) { return fract(sin(n * 127.1) * 43758.5453); }\nfloat hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nvec2 hash22(vec2 p) {\n    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);\n}\nfloat vnoise(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),\n               mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);\n}\n// Шум, замкнутый по x с периодом period: для узоров по углу без шва.\nfloat vnoiseWrap(vec2 p, float period) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float x0 = mod(i.x, period), x1 = mod(i.x + 1.0, period);\n    return mix(mix(hash21(vec2(x0, i.y)), hash21(vec2(x1, i.y)), f.x),\n               mix(hash21(vec2(x0, i.y + 1.0)), hash21(vec2(x1, i.y + 1.0)), f.x), f.y);\n}\nmat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }\n\n// Ширина одного пикселя в единицах глаза и покрытие для сглаживания краёв.\nfloat px() { return 1.0 / max(uUnit, 1.0); }\nfloat cover(float d) { float w = px(); return 1.0 - smoothstep(-w, w, d); }\nfloat coverSoft(float d, float w) { return 1.0 - smoothstep(-w, w, d); }\n// Линия полуширины hw вокруг d = 0.\nfloat stroke(float d, float hw) { return cover(abs(d) - hw); }\n\nfloat sdSegment(vec2 p, vec2 a, vec2 b) {\n    vec2 pa = p - a, ba = b - a;\n    return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0));\n}\nfloat sdRoundBox(vec2 p, vec2 b, float r) {\n    vec2 d = abs(p) - b + vec2(r);\n    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;\n}\n\n// Кромка века — дуга окружности через оба уголка (±wi, 0) с вершиной в (0, k).\n// Возвращает расстояние со знаком: больше нуля ниже дуги (y направлена вниз).\nfloat arcBelow(vec2 q, float wi, float k) {\n    if (abs(k) < 0.002) return q.y - k;\n    float rad = (wi * wi + k * k) / (2.0 * abs(k));\n    float cy = k < 0.0 ? k + rad : k - rad;\n    float d = length(vec2(q.x, q.y - cy)) - rad;\n    return k < 0.0 ? -d : d;\n}\n\n// Точное расстояние до линзы из двух дуг: верхняя с вершиной -hu, нижняя с вершиной +hl.\nfloat sdLens(vec2 q, float wi, float hu, float hl) {\n    float ru = (wi * wi + hu * hu) / (2.0 * hu), rl = (wi * wi + hl * hl) / (2.0 * hl);\n    float cu = -hu + ru, cl = hl - rl;                 // центры: верхней дуги — ниже, нижней — выше\n    vec2 a = vec2(abs(q.x), q.y);\n    float d = max(length(vec2(a.x, a.y - cu)) - ru, length(vec2(a.x, a.y - cl)) - rl);\n    // За уголком ближайшая точка — сам уголок.\n    vec2 v = a - vec2(wi, 0.0);\n    vec2 nu = vec2(wi, -cu), nl = vec2(wi, -cl);       // нормали дуг в уголке\n    if (nu.x * v.y - nu.y * v.x > 0.0 && v.x * nl.y - v.y * nl.x > 0.0) d = length(v);\n    return d;\n}\n\n// Силуэт глаза и раскрытие между веками. Все расстояния — в единицах глаза.\n//   dShape < 0 внутри силуэта;\n//   dTop > 0 ниже кромки верхнего века, dBot > 0 выше кромки нижнего (то есть в раскрытой части).\n// rnd скругляет уголки; closeY — где смыкаются веки (ниже центра).\nvoid eyeGeom(vec2 q, float hU, float hL, float rnd, float closeY,\n             out float dShape, out float dTop, out float dBot) {\n    float wi = EYE_W - rnd, hu = hU - rnd, hl = hL - rnd;\n    dShape = sdLens(q, wi, hu, hl) - rnd;\n    float lt = clamp(uLidTop, 0.0, 1.0), lb = clamp(uLidBot, 0.0, 1.0);\n    dTop = arcBelow(q, wi, mix(-hu, closeY, lt)) + rnd * (1.0 - lt);\n    dBot = -arcBelow(q, wi, mix(hl, closeY, lb)) + rnd * (1.0 - lb);\n}\n\n// Центр радужки на экране для направления взгляда g из [-1, 1].\nvec2 irisCenter(vec2 g, vec2 travel, float y0) { return vec2(g.x * travel.x, g.y * travel.y + y0); }\n\n// Координаты точки в плоскости радужки (в её радиусах): яблоко — шар,\n// поэтому при взгляде в сторону диск сплющивается вдоль направления взгляда.\nvec2 irisUV(vec2 q, vec2 c, float rI) {\n    vec2 v = q - c;\n    float cl = length(c);\n    if (cl > 1e-4) {\n        vec2 d = c / cl;\n        float s = sqrt(max(0.2, 1.0 - cl * cl / (EYE_R * EYE_R)));\n        float par = dot(v, d);\n        v += d * (par / s - par);\n    }\n    return v / rI;\n}\n\n// Наложение источника с предумноженной альфой поверх накопленного цвета.\nvec4 over(vec4 dst, vec3 rgb, float a) { return vec4(dst.rgb * (1.0 - a) + rgb * a, dst.a * (1.0 - a) + a); }\n\n// ---- Общая анатомия образов, построенных на глазе «Смотрителя» ----\n// geo = (полуширина раскрытия, высота верхней дуги, высота нижней дуги, линия смыкания век).\n// Высота «домика» над точкой x (печаль): вершина в (0, k), скаты провисают к уголкам.\nfloat eyTentY(float x, float k, float wi) {\n    const float a = 0.50;\n    float s = (sqrt(x * x + a * a) - a) / (sqrt(wi * wi + a * a) - a);\n    return k * (1.0 - pow(clamp(s, 0.0, 1.0), 0.72));\n}\n// Кромка верхнего века: дуга через уголки с вершиной в (0, k); печаль складывает её «домиком».\nfloat eyTop(vec2 p, float wi, float k, float sad) {\n    float d = arcBelow(p, wi, k);\n    if (sad < 0.001 || k > -0.05) return d;\n    float kt = k - 0.12;\n    float y = eyTentY(p.x, kt, wi);\n    float dy = (eyTentY(p.x + 0.02, kt, wi) - eyTentY(p.x - 0.02, kt, wi)) / 0.04;\n    return mix(d, (p.y - y) / sqrt(1.0 + dy * dy), sad);\n}\n// Кромки век с мимикой: dTop > 0 ниже верхнего века, dBot > 0 выше нижнего; xs — координата вдоль верхнего\n// века с учётом перекоса. lt и lb — насколько закрыты веки.\nvoid eyLids(vec2 q, vec4 geo, float lt, float lb, out float dTop, out float dBot, out float xs) {\n    float t = q.x / geo.x;\n    xs = q.x - clamp(uFace.x, -1.0, 1.0) * 0.36 * geo.x * max(0.0, 1.0 - t * t);\n    dTop = eyTop(vec2(xs, q.y), geo.x, mix(-geo.y, geo.w, lt), clamp(uFace.z, 0.0, 1.0) * (1.0 - smoothstep(0.45, 0.85, lt)));\n    dBot = -arcBelow(q, geo.x, mix(geo.z, geo.w, lb) - clamp(uFace.y, 0.0, 1.0) * 1.25 * geo.z * (1.0 - lb));\n}\n// Радужка: яблоко поворачивается (диск сплющен вдоль взгляда), на быстром взгляде диск чуть вытянут,\n// зрачок внутри радужки сдвинут в сторону взгляда. c — центр на экране, u — координаты в радиусах радужки,\n// up — координаты от центра зрачка.\nvoid eyIris(vec2 q, vec2 travel, float y0, float rI, out vec2 c, out vec2 u, out vec2 up) {\n    c = irisCenter(uGaze, travel, y0);\n    vec2 smear = c - irisCenter(uGaze2, travel, y0);\n    float speed = length(smear);\n    u = irisUV(q, c, rI);\n    vec2 gz = uGaze * vec2(1.0, 0.5);\n    float turn = min(length(gz), 1.0);\n    if (turn > 0.001) {\n        vec2 d = gz / length(gz);\n        u += d * dot(u, d) * (1.0 / mix(1.0, 0.84, turn * turn) - 1.0);\n    }\n    if (speed > 0.0005) {\n        vec2 d = smear / speed;\n        float k = 1.0 + min(speed * 0.40, 0.08);\n        float par = dot(u, d);\n        u = d * (par / k) + (u - d * par) * sqrt(k);\n    }\n    vec2 pc = uGaze * vec2(0.22, 0.13) + (uGaze2 - uGaze) * vec2(0.10, 0.06);\n    up = u - pc * (1.0 - smoothstep(0.62, 1.0, length(u)));\n}\n// Лист или пучок шерсти: капля вдоль оси x от основания (0, 0) длиной len, наибольшая полуширина wd\n// на трети длины, остриё на конце. v — точка в осях капли. t — доля длины. Расстояние приближённое.\nfloat eyDrop(vec2 v, float len, float wd, out float t) {\n    t = clamp(v.x / len, 0.0, 1.0);\n    float prof = wd * pow(max(sin(PI * pow(t, 0.62)), 0.0), 0.85);\n    float d = abs(v.y) - prof;\n    if (v.x < 0.0) d = max(d, -v.x);\n    if (v.x > len) d = length(v - vec2(len, 0.0));\n    return d;\n}\n// Четырёхлучевая звёздочка радиуса r: расстояние меньше нуля внутри.\nfloat eyStar(vec2 v, float r) {\n    v = abs(v);\n    return (pow(v.x, 0.55) + pow(v.y, 0.55)) - pow(r, 0.55);\n}\n\n// «Архив I»: самый первый глаз, каким он жил в оболочке Noctalia в январе 2026 года.\n// Три ровных пятна без линий, бликов и теней: тёмный белок, розовая радужка, светлый зрачок.\n// Век не видно — они цвета фона: моргая, глаз просто сужается к средней линии и пропадает.\n// Цвета: uC1 белок, uC2 радужка, uC3 зрачок. Мимика, тревога, позы и сон этим рисунком не используются.\nconst float A1_W = 2.80;                 // полуширина глаза\nconst float A1_H = 0.72;                 // полувысота\nconst float A1_RI = 0.905;               // радиус радужки\nconst float A1_RP = 0.585;               // радиус зрачка\nconst float A1_GO = 0.345;               // наибольший сдвиг радужки; предел круглый, как в исходном коде\n\nvec4 eye(vec2 q) {\n    float nx = q.x / A1_W;\n    float curve = A1_H * pow(max(0.0, 1.0 - nx * nx), 0.96);\n    // Веки сходятся к средней линии. В моргании движок доводит нижнее веко до 0,9: здесь это уже «закрыто».\n    float lt = clamp(uLidTop, 0.0, 1.0), lb = clamp(uLidBot / 0.9, 0.0, 1.0);\n    float dOpen = max(-curve * (1.0 - lt) - q.y, q.y - curve * (1.0 - lb));\n    float open = cover(dOpen) * cover(abs(q.x) - A1_W) * (1.0 - smoothstep(0.985, 1.0, min(lt, lb)));\n    if (open < 0.001) return vec4(0.0);\n    // Радужка ходит недалеко и упирается в круг: чем дальше указатель, тем ближе к краю круга.\n    float m = length(uGaze);\n    vec2 c = m > 0.0001 ? uGaze / m * A1_GO * (1.0 - exp(-4.0 * m)) : vec2(0.0);\n    vec3 col = uC1.rgb;\n    col = mix(col, uC2.rgb, cover(length(q - c) - A1_R const q = new URLSearchParams(location.search);
if (q.has('solo')) {
  // Статичный кадр для проверки: ?solo=pearl&variant=dark&gx=0.4&gy=-0.2&lt=0&lb=0&pupil=1&bg=000000
  document.body.classList.add('solo'); const cv = document.getElementById('solo'); cv.hidden = false;
  document.documentElement.style.background = document.body.style.background = '#' + (q.get('bg') || '000000'); document.getElementById('err').style.padding = 0;
  const eye = Eye(cv, q.get('solo'), q.get('variant') || 'dark'); const num = k => q.has(k) ? parseFloat(q.get(k)) : undefined;
  eye.fixed = { gx: num('gx') ?? 0, gy: num('gy') ?? 0, px: num('px'), py: num('py'), lt: num('lt') ?? 0, lb: num('lb') ?? 0, pupil: num('pupil') ?? 1,
    p0: q.has('p0') ? q.get('p0').split(',').map(Number) : undefined, p1: q.has('p1') ? q.get('p1').split(',').map(Number) : undefined, mood: q.has('mood') ? q.get('mood').split(',').map(Number) : undefined, face: q.has('face') ? q.get('face').split(',').map(Number) : undefined, pose: q.has('pose') ? q.get('pose').split(',').map(Number) : undefined, wake: num('wake') ?? 0, pulse: num('pulse') ?? 0, dim: num('dim') ?? 1, energy: num('energy') ?? 0, time: num('time') ?? 0 };
  if (q.has('pdx')) { eye.pdx = num('pdx'); eye.pdy = num('pdy') ?? 0; }

  const pointer = { x: innerWidth / 2, y: innerHeight / 2 };
  addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
  let current = q.get('skin') || DATA.order[0], variant = q.get('variant') || 'dark';
  const stage = Eye(document.getElementById('stage'), current, variant); const eyes = [stage];
  const tabs = document.getElementById('tabs'), gallery = document.getElementById('gallery');
  for (const id of DATA.order) {
    const s = DATA.skins[id];
    const b = document.createElement('button'); b.textContent = s.title; b.dataset.id = id; b.onclick = () => select(id); tabs.append(b);
    const card = document.createElement('div'); card.className = 'card'; const cv = document.createElement('canvas');
    const cap = document.createElement('div'); cap.innerHTML = '<b></b><span></span>'; cap.firstChild.textContent = s.title; cap.lastChild.textContent = s.note;

    document.getElementById('skinnote').textContent = s.note;
    const sw = document.getElementById('swatches'); sw.textContent = '';
    const names = { bg: 'Фон', surface: 'Поверхность', text: 'Текст', muted: 'Приглушённый', a1: 'Акцент 1', a2: 'Акцент 2', a3: 'Акцент 3', outline: 'Рамка' };
    for (const [k, val] of Object.entries(pg)) { const d = document.createElement('div'); d.className = 'sw'; d.innerHTML = '<i></i><b></b><code></code>';
      d.children[0].style.background = val; d.children[1].textContent = names[k] || k; d.children[2].textContent = val; sw.append(d); }
  }
  document.getElementById('variant').onclick = () => { const o = variant === 'dark' ? 'light' : 'dark'; if (DATA.skins[current].variants[o]) { variant = o; paint(); } };
  document.getElementById('blink').onclick = () => blink(stage);
  document.getElementById('sleep').onclick = e => { const on = !stage.sleep; tween(stage, 'sleep', on ? 1 : 0, on ? 900 : 380, () => { if (!on) { stage.wake = 1; blink(stage); } }); e.target.setAttribute('aria-pressed', String(on)); };
