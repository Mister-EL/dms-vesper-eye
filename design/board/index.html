<script>
const DATA = {"order": ["pearl", "signal", "lattice", "neon", "eclipse", "vesper"], "skins": {"pearl": {"title": "Перламутр", "note": "Пастель: белый, розовый, голубой. Опаловая радужка с переливом.", "shader": "pearl", "irisRadius": 0.9, "motion": {"omega": 17, "blinkClose": 110, "blinkHold": 40, "blinkOpen": 240}, "variants": {"dark": {"title": "Сумерки", "page": {"bg": "#0C0A12", "surface": "#15121E", "text": "#F3EDF6", "muted": "#B9B0CC", "a1": "#F5A8C6", "a2": "#A8D2F5", "a3": "#CDBEF5", "outline": "#6F6788"}, "colors": ["#FBF6FA", "#CBBFE2", "#8EC5F2", "#C7B5F1", "#F3A6C6", "#2F2A45", "#17131F", "#E9B8A6"]}, "light": {"title": "День", "page": {"bg": "#F8F4F6", "surface": "#FFFFFF", "text": "#2F2A45", "muted": "#6A6382", "a1": "#B84877", "a2": "#3674B4", "a3": "#6F5CB8", "outline": "#B9ACC0"}, "colors": ["#FDFBFC", "#D6CBE8", "#8EC5F2", "#C7B5F1", "#F3A6C6", "#2F2A45", "#FBF7F8", "#E9B8A6"]}}, "restLid": 0.1, "themeMap": ["", "", "secondary", "tertiary", "primary", "", "surface", "primary"]}, "signal": {"title": "Сигнал", "note": "Чёрный, белый, серый и одна ярко-зелёная радужка. Чертёж и прибор.", "shader": "signal", "irisRadius": 0.74, "restLid": 0.0, "motion": {"omega": 30, "blinkClose": 60, "blinkHold": 20, "blinkOpen": 120}, "themeMap": ["surfaceText", "", "primary", "", "", "outline", "", "primary"], "variants": {"dark": {"title": "Ночь", "page": {"bg": "#000000", "surface": "#0E0E10", "text": "#F4F4F5", "muted": "#A1A1AA", "a1": "#3DFF6E", "a2": "#D4D4D8", "a3": "#8E8E96", "outline": "#5E5E66"}, "colors": ["#F4F4F5", "#000000", "#3DFF6E", "#000000", "#FFFFFF", "#6B6B73", "#000000", "#1F8A3C"]}, "light": {"title": "Бумага", "page": {"bg": "#EDEDEE", "surface": "#FFFFFF", "text": "#0B0B0C", "muted": "#55555C", "a1": "#008A34", "a2": "#3F3F46", "a3": "#71717A", "outline": "#8A8A93"}, "colors": ["#0B0B0C", "#FFFFFF", "#3DFF6E", "#0B0B0C", "#FFFFFF", "#8A8A93", "#EDEDEE", "#1F8A3C"]}}}, "lattice": {"title": "Сеть", "note": "Глаз, сплетённый из узлов и связей: созвездие, карта маршрутов. Пакет бежит к корневому узлу.", "shader": "lattice", "irisRadius": 0.78, "restLid": 0.0, "motion": {"omega": 18, "blinkClose": 100, "blinkHold": 40, "blinkOpen": 220}, "themeMap": ["primary", "surfaceText", "tertiary", "secondary", "", "", "outline", "primary"], "variants": {"dark": {"title": "Магистраль", "page": {"bg": "#03060C", "surface": "#0A111D", "text": "#E4EEFF", "muted": "#93A8C9", "a1": "#5CC8FF", "a2": "#FFC46B", "a3": "#6DFFD0", "outline": "#4A6088"}, "colors": ["#5CC8FF", "#E3EEFF", "#FFC46B", "#6DFFD0", "#123E73", "#000000", "#2F6DB5", "#7CCBFF"]}}}, "neon": {"title": "Неон-нуар", "note": "Киберпанк: оптический имплант с диафрагмой. Циан и маджента на чёрном стекле.", "shader": "neon", "irisRadius": 0.74, "restLid": 0.0, "motion": {"omega": 26, "blinkClose": 70, "blinkHold": 30, "blinkOpen": 150}, "themeMap": ["", "secondary", "primary", "tertiary", "", "", "", ""], "variants": {"dark": {"title": "Ночной город", "page": {"bg": "#05030A", "surface": "#0E0818", "text": "#ECE8FF", "muted": "#A99FD0", "a1": "#FF3D9A", "a2": "#2DE2FF", "a3": "#FFE45C", "outline": "#5B4A86"}, "colors": ["#0E0818", "#2DE2FF", "#FF3D9A", "#8A5CFF", "#FFE45C", "#FF2D55", "#0B0714", "#2A2148"]}}}, "eclipse": {"title": "Затмение", "note": "Полное солнечное затмение: чёрный диск Луны, жемчужная корона и серп Солнца при взгляде в сторону.", "shader": "eclipse", "irisRadius": 0.9, "restLid": 0.08, "motion": {"omega": 14, "blinkClose": 130, "blinkHold": 50, "blinkOpen": 280}, "themeMap": ["", "", "primary", "", "", "", "tertiary", ""], "variants": {"dark": {"title": "Полная фаза", "page": {"bg": "#000000", "surface": "#0A0B10", "text": "#F1EEE6", "muted": "#A5A7B5", "a1": "#F3DDAA", "a2": "#FF6F8B", "a3": "#9DB4FF", "outline": "#5F6274"}, "colors": ["#F6F1E7", "#F3DDAA", "#FF5E7E", "#0B1020", "#020308", "#000000", "#9DB4FF", "#04050A"]}}}, "vesper": {"title": "Веспер", "note": "Прежний готический вид: винный гранат, кость и потемневшая латунь.", "shader": "vesper", "irisRadius": 0.92, "restLid": 0.1, "motion": {"omega": 20, "blinkClose": 95, "blinkHold": 30, "blinkOpen": 175}, "themeMap": ["", "", "", "primary", "secondary", "", "surface", "primary"], "variants": {"dark": {"title": "Sanguine Ivory", "page": {"bg": "#0D0B10", "surface": "#17121A", "text": "#E8DDCF", "muted": "#B6A6B1", "a1": "#CC6B7C", "a2": "#C6A36D", "a3": "#A28DB8", "outline": "#796572"}, "colors": ["#D2C4AE", "#6B5960", "#2A0F1A", "#8A324C", "#C6A36D", "#08070B", "#17121A", "#CC6B7C"]}}}}, "shaders": {"eclipse": "#version 300 es\nprecision highp float;\nin vec2 vUv;\nout vec4 fragColor;\nuniform float uTime;\nuniform vec2 uSize;\nuniform float uUnit;\nuniform float uPupil;\nuniform vec2 uGaze;\nuniform vec2 uGaze2;\nuniform float uLidTop;\nuniform float uLidBot;\nuniform float uEnergy;\nuniform float uWake;\nuniform float uPulse;\nuniform float uDim;\nuniform vec2 uPulseDir;\nuniform float uLight;\nuniform vec4 uC0;\nuniform vec4 uC1;\nuniform vec4 uC2;\nuniform vec4 uC3;\nuniform vec4 uC4;\nuniform vec4 uC5;\nuniform vec4 uC6;\nuniform vec4 uC7;\nuniform vec4 uP0;\nuniform vec4 uP1;\n\n// Общая геометрия и утилиты. Координаты q — в «единицах глаза»:\n// 1 единица = половина высоты раскрытого глаза (uUnit пикселей), ось y направлена вниз.\n// Цвет на выходе eye() — с предумноженной альфой.\n#define PI 3.14159265\n#define TAU 6.28318531\n\n// Рамка глаза одна для всех образов: полуширина раскрытия в единицах.\n#define EYE_W 2.5\n// Радиус глазного яблока: от него зависит, насколько радужка сплющивается при взгляде в сторону.\n#define EYE_R 2.5\n\nfloat hash11(float n) { return fract(sin(n * 127.1) * 43758.5453); }\nfloat hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nvec2 hash22(vec2 p) {\n    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);\n}\nfloat vnoise(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),\n               mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);\n}\n// Шум, замкнутый по x с периодом period: для узоров по углу без шва.\nfloat vnoiseWrap(vec2 p, float period) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float x0 = mod(i.x, period), x1 = mod(i.x + 1.0, period);\n    return mix(mix(hash21(vec2(x0, i.y)), hash21(vec2(x1, i.y)), f.x),\n               mix(hash21(vec2(x0, i.y + 1.0)), hash21(vec2(x1, i.y + 1.0)), f.x), f.y);\n}\nmat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }\n\n// Ширина одного пикселя в единицах глаза и покрытие для сглаживания краёв.\nfloat px() { return 1.0 / max(uUnit, 1.0); }\nfloat cover(float d) { float w = px(); return 1.0 - smoothstep(-w, w, d); }\nfloat coverSoft(float d, float w) { return 1.0 - smoothstep(-w, w, d); }\n// Линия полуширины hw вокруг d = 0.\nfloat stroke(float d, float hw) { return cover(abs(d) - hw); }\n\nfloat sdSegment(vec2 p, vec2 a, vec2 b) {\n    vec2 pa = p - a, ba = b - a;\n    return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0));\n}\nfloat sdRoundBox(vec2 p, vec2 b, float r) {\n    vec2 d = abs(p) - b + vec2(r);\n    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;\n}\n\n// Кромка века — дуга окружности через оба уголка (±wi, 0) с вершиной в (0, k).\n// Возвращает расстояние со знаком: больше нуля ниже дуги (y направлена вниз).\nfloat arcBelow(vec2 q, float wi, float k) {\n    if (abs(k) < 0.002) return q.y - k;\n    float rad = (wi * wi + k * k) / (2.0 * abs(k));\n    float cy = k < 0.0 ? k + rad : k - rad;\n    float d = length(vec2(q.x, q.y - cy)) - rad;\n    return k < 0.0 ? -d : d;\n}\n\n// Точное расстояние до линзы из двух дуг: верхняя с вершиной -hu, нижняя с вершиной +hl.\nfloat sdLens(vec2 q, float wi, float hu, float hl) {\n    float ru = (wi * wi + hu * hu) / (2.0 * hu), rl = (wi * wi + hl * hl) / (2.0 * hl);\n    float cu = -hu + ru, cl = hl - rl;                 // центры: верхней дуги — ниже, нижней — выше\n    vec2 a = vec2(abs(q.x), q.y);\n    float d = max(length(vec2(a.x, a.y - cu)) - ru, length(vec2(a.x, a.y - cl)) - rl);\n    // За уголком ближайшая точка — сам уголок.\n    vec2 v = a - vec2(wi, 0.0);\n    vec2 nu = vec2(wi, -cu), nl = vec2(wi, -cl);       // нормали дуг в уголке\n    if (nu.x * v.y - nu.y * v.x > 0.0 && v.x * nl.y - v.y * nl.x > 0.0) d = length(v);\n    return d;\n}\n\n// Силуэт глаза и раскрытие между веками. Все расстояния — в единицах глаза.\n//   dShape < 0 внутри силуэта;\n//   dTop > 0 ниже кромки верхнего века, dBot > 0 выше кромки нижнего (то есть в раскрытой части).\n// rnd скругляет уголки; closeY — где смыкаются веки (ниже центра).\nvoid eyeGeom(vec2 q, float hU, float hL, float rnd, float closeY,\n             out float dShape, out float dTop, out float dBot) {\n    float wi = EYE_W - rnd, hu = hU - rnd, hl = hL - rnd;\n    dShape = sdLens(q, wi, hu, hl) - rnd;\n    float lt = clamp(uLidTop, 0.0, 1.0), lb = clamp(uLidBot, 0.0, 1.0);\n    dTop = arcBelow(q, wi, mix(-hu, closeY, lt)) + rnd * (1.0 - lt);\n    dBot = -arcBelow(q, wi, mix(hl, closeY, lb)) + rnd * (1.0 - lb);\n}\n\n// Центр радужки на экране для направления взгляда g из [-1, 1].\nvec2 irisCenter(vec2 g, vec2 travel, float y0) { return vec2(g.x * travel.x, g.y * travel.y + y0); }\n\n// Координаты точки в плоскости радужки (в её радиусах): яблоко — шар,\n// поэтому при взгляде в сторону диск сплющивается вдоль направления взгляда.\nvec2 irisUV(vec2 q, vec2 c, float rI) {\n    vec2 v = q - c;\n    float cl = length(c);\n    if (cl > 1e-4) {\n        vec2 d = c / cl;\n        float s = sqrt(max(0.2, 1.0 - cl * cl / (EYE_R * EYE_R)));\n        float par = dot(v, d);\n        v += d * (par / s - par);\n    }\n    return v / rI;\n}\n\n// Наложение источника с предумноженной альфой поверх накопленного цвета.\nvec4 over(vec4 dst, vec3 rgb, float a) { return vec4(dst.rgb * (1.0 - a) + rgb * a, dst.a * (1.0 - a) + a); }\n\n// «Затмение»: полное солнечное затмение как глаз неба. Зрачок — диск Луны, радужка — корона. Цвета:\n//   uC0 корона (жемчужный белый), uC1 золото: Солнце, «бриллиантовое кольцо» и тепло у края диска,\n//   uC2 хромосфера и протуберанцы, uC3 небо возле Солнца (индиго), uC4 небо в уголках (почти чёрное),\n//   uC5 диск Луны, uC6 холодный оттенок: дальняя корона, звёзды, отсвет по силуэту, uC7 веки (тень).\n// Солнце стоит в центре радужки; Луна чуть больше и съезжает по взгляду, открывая серп с обратной стороны.\nconst float EC_RI = 0.90;      // радиус радужки в единицах глаза\nconst float EC_R0 = 0.40;      // радиус Солнца в радиусах радужки при uPupil = 1\nconst float EC_MOON = 1.045;   // во сколько раз Луна больше Солнца\nconst float EC_TILT = -0.14;   // наклон солнечного экватора, рад\n\n// Расстояние по углу, угол в оборотах.\nfloat ecArc(float a) { return abs(fract(a + 0.5) - 0.5); }\n\n// Длинный стример: ось a0 (обороты), изгиб bend, полуширина у основания wid, длина затухания len (в радиусах Солнца).\n// Основание широкое, дальше луч сходится в остриё.\nfloat ecStreamer(float an, float x, float a0, float bend, float wid, float len) {\n    float d = ecArc(an - a0 - bend * x / (1.0 + x));\n    float w = wid * (0.04 + 0.96 / pow(1.0 + x, 1.6));\n    return exp(-d * d / (w * w)) * exp(-x / len);\n}\n\n// Протуберанец: язычок над краем Солнца. h — высота над краем в радиусах радужки.\nfloat ecProm(float an, float h, float a0, float wid, float height) {\n    float d = ecArc(an - a0 - h * 0.3);\n    float k = h / height;\n    return exp(-d * d / (wid * wid)) * exp(-k * k);\n}\n\n// Неподвижные звёзды: не больше одной на ячейку, яркость разная.\nfloat ecStars(vec2 q, float cell, float seed, float keep) {\n    vec2 g = q / cell + vec2(seed, seed * 1.7);\n    vec2 id = floor(g);\n    float sel = hash21(id + vec2(seed * 3.1, 5.3));\n    if (sel < keep) return 0.0;\n    float b = (sel - keep) / (1.0 - keep);\n    vec2 p = (fract(g) - (0.22 + 0.56 * hash22(id + vec2(1.7, seed)))) * cell;\n    float sr = max(0.010, 1.05 * px()) * (0.75 + 0.6 * b);\n    float tw = 1.0 + 0.22 * sin(uTime * (1.3 + 2.0 * b) + sel * 40.0);\n    float s = exp(-dot(p, p) / (sr * sr));\n    // У самых ярких — мягкий ореол.\n    s += smoothstep(0.70, 1.0, b) * 0.22 * exp(-length(p) / (2.2 * sr));\n    return s * (0.10 + 0.90 * b * b) * tw;\n}\n\nvec4 eye(vec2 q) {\n    float dShape, dTop, dBot;\n    eyeGeom(q, 1.0, 0.88, 0.05, 0.24, dShape, dTop, dBot);\n    float w = px();\n    float aw = 1.2 * w / EC_RI;\n    float pup = clamp(uPupil, 0.6, 1.6);\n    float energy = clamp(uEnergy, 0.0, 1.0);\n    float wake = clamp(uWake, 0.0, 1.0);\n\n    // Солнце — в центре радужки.\n    vec2 c = irisCenter(uGaze, vec2(1.05, 0.30), -0.07);\n    vec2 u = irisUV(q, c, EC_RI);\n    float r = length(u);\n    float rs = EC_R0 * pup, rm = rs * EC_MOON;\n    // Луна: сдвиг по запаздывающему взгляду и на долю самого взгляда; при пробуждении диск на миг съезжает.\n    vec2 mOff = uGaze2 * vec2(0.036, 0.031) + uGaze * vec2(0.028, 0.024) + wake * vec2(0.046, 0.037);\n    float dm = length(u - mOff) - rm;\n\n    // --- Корона ---\n    float ang = atan(u.y, u.x + 1e-5) - EC_TILT;   // сдвиг: в самом центре угол не определён\n    float an = ang / TAU + 0.5;\n    float x = max(r - rs, 0.0) / EC_R0;           // высота над краем Солнца в его радиусах\n    float xf = x / (1.0 + x);\n    float eq = cos(ang); eq *= eq;                // 1 на экваторе, 0 на полюсах\n    // Силовые линии: от полюсов лучи расходятся к экватору.\n    float an0 = an + 0.050 * sin(2.0 * ang) * xf;\n    float drift = uTime * 0.02;\n    float pxa = r * EC_RI * TAU / w;              // пикселей в окружности на этом радиусе\n    float env = vnoiseWrap(vec2(an0 * 7.0, 1.3), 7.0);\n    float env2 = vnoiseWrap(vec2(an0 * 17.0, 4.1 + x * 0.15), 17.0);\n    float n1 = vnoiseWrap(vec2(an0 * 40.0, x * 0.50 + 2.0 - drift), 40.0);\n    float n2 = mix(0.5, vnoiseWrap(vec2(an0 * 104.0, x * 0.80 + 7.0 - drift), 104.0), smoothstep(1.5, 3.5, pxa / 104.0));\n    float n3 = mix(0.5, vnoiseWrap(vec2(an0 * 250.0, x * 1.20 + 13.0 - drift), 250.0), smoothstep(1.5, 3.5, pxa / 250.0));\n    float fine = n2 * 0.62 + n3 * 0.38;\n    float fil = n1 * 0.40 + n2 * 0.36 + n3 * 0.24;\n    float away = smoothstep(0.02, 0.50, x);\n    // У каждого луча своя длина: короткие перья у полюсов, длинные — вдоль экватора.\n    float Lr = (0.15 + 0.46 * eq * (0.30 + env) + 0.30 * env * env2) * (0.50 + 1.00 * n1) * (1.0 + 0.25 * energy);\n    float lum = 2.6 * exp(-x / 0.060)\n              + 0.90 * exp(-x / (0.22 + 0.16 * eq))\n              + 0.60 * exp(-x / Lr) * mix(1.0, 0.30 + 1.9 * fine * fine + 0.5 * n1, away)\n              + 0.085 * exp(-x / (0.9 + 1.3 * eq * (0.4 + env)));\n    // Тонкие нити поверх лучей.\n    float nt = vnoiseWrap(vec2(an0 * 58.0, x * 0.30 + 21.0 - drift), 58.0);\n    float thr = pow(1.0 - abs(2.0 * nt - 1.0), 5.0) * smoothstep(1.5, 4.0, pxa / 58.0);\n    lum += 0.22 * thr * exp(-x / (1.5 * Lr + 0.12)) * away;\n    float st = 1.00 * ecStreamer(an, x, 0.988, 0.012, 0.052, 1.60)\n             + 0.90 * ecStreamer(an, x, 0.515, -0.010, 0.046, 1.35)\n             + 0.60 * ecStreamer(an, x, 0.452, 0.018, 0.028, 0.90)\n             + 0.62 * ecStreamer(an, x, 0.066, -0.016, 0.030, 1.00)\n             + 0.45 * ecStreamer(an, x, 0.902, 0.014, 0.024, 0.75)\n             + 0.36 * ecStreamer(an, x, 0.392, -0.012, 0.020, 0.60)\n             + 0.42 * ecStreamer(an, x, 0.612, 0.010, 0.024, 0.80);\n    lum += st * 0.80 * mix(1.0, 0.50 + 1.0 * fil, away);\n    lum *= 1.0 + 0.7 * energy;\n    float tone = 1.0 - exp(-lum);\n    vec3 cor = mix(uC6.rgb, uC0.rgb, smoothstep(0.0, 0.26, tone)) * tone;\n    cor = mix(cor, uC1.rgb * tone, 0.22 * exp(-x / 0.30));\n    cor += vec3(1.0) * smoothstep(0.80, 1.0, tone) * 0.10;\n\n    // --- Небо и звёзды ---\n    float sd = length((q - c * 0.35) * vec2(0.50, 1.0));\n    vec3 col = mix(uC3.rgb, uC4.rgb, smoothstep(0.10, 1.45, sd));\n    float stars = ecStars(q, 0.52, 6.1, 0.62) + 0.45 * ecStars(q, 0.29, 14.9, 0.70);\n    col += mix(uC6.rgb, vec3(1.0), 0.55) * stars * pow(1.0 - tone, 6.0);\n    col += cor;\n\n    // --- Хромосфера и протуберанцы ---\n    float h = max(r - rs, 0.0);\n    // Нить хромосферы видна не по всему краю, а дугами.\n    float thread = smoothstep(0.30, 0.72, vnoiseWrap(vec2(an * 9.0, 0.7), 9.0));\n    float hk = h / (0.024 * pup);\n    float chroma = exp(-hk * hk) * (0.20 + 1.5 * thread);\n    chroma += 1.00 * ecProm(an, h, 0.305, 0.011, 0.046 * pup)\n            + 0.95 * ecProm(an, h, 0.585, 0.014, 0.052 * pup)\n            + 0.90 * ecProm(an, h, 0.835, 0.008, 0.042 * pup)\n            + 0.80 * ecProm(an, h, 0.075, 0.006, 0.038 * pup);\n    float hot = 0.0;\n    if (uPulse > 0.0005) {\n        // Событие: арка протуберанца на краю лунного диска с той стороны, откуда оно пришло.\n        float grow = sin(clamp(uPulse, 0.0, 1.0) * PI);\n        vec2 pd = uPulseDir / max(length(uPulseDir), 1e-3);\n        vec2 v = u - mOff - pd * rm;\n        float n = dot(v, pd), t = dot(v, vec2(-pd.y, pd.x)) + 0.25 * n;      // арка чуть наклонена\n        vec2 ax = vec2(0.090, 0.040 + 0.200 * grow);\n        vec2 ev = vec2(t, n + 0.02) / ax;\n        float el = length(ev);\n        float phi = atan(ev.y, ev.x);                  // 0 и PI — основания, PI/2 — вершина\n        float mn = min(ax.x, ax.y);\n        // Не замкнутое кольцо, а нить: плотная у основания, к другому концу истончается и гаснет.\n        float fade = 1.0 - smoothstep(1.5, 2.9, phi);\n        float th = mix(0.021, 0.007, smoothstep(0.0, 2.6, phi));\n        float knots = 0.60 + 0.70 * vnoise(vec2(phi * 3.2 + 4.0, 1.5));\n        float dl = (el - 1.0) * mn;\n        float arch = exp(-dl * dl / (th * th)) * knots * fade;\n        float dl2 = (el - 0.74 - 0.10 * sin(phi * 2.0)) * mn;\n        float arch2 = exp(-dl2 * dl2 / (0.45 * th * th)) * (1.0 - smoothstep(0.9, 2.2, phi)) * 0.55;\n        float veil = exp(-abs(dl) / 0.050) * 0.14 * fade;\n        // Вспышка хромосферы по краю диска у основания.\n        float base = exp(-t * t / 0.020) * exp(-n * n / 0.0009);\n        chroma += grow * ((1.4 * arch + arch2 + veil) * smoothstep(-0.02, 0.03, n) + 0.9 * base);\n        hot = grow * arch * arch;\n    }\n    chroma = max(chroma - 0.05, 0.0) / 0.95;\n    chroma = clamp(chroma, 0.0, 1.0);\n    col = mix(col, uC2.rgb + vec3(0.12) * chroma + vec3(0.30) * min(hot, 1.0), chroma * 0.92);\n\n    // --- Солнце и Луна ---\n    float sunMask = coverSoft(r - rs, aw);\n    col = mix(col, mix(uC1.rgb, vec3(1.0), 0.80), sunMask);\n    float moonMask = coverSoft(dm, aw);\n    col = mix(col, uC5.rgb, moonMask);\n\n    // «Бриллиантовое кольцо»: свечение вокруг открытого серпа.\n    float off = length(mOff);\n    float tC = max(off - (rm - rs), 0.0);         // наибольшая толщина серпа\n    if (tC > 0.0) {\n        float bAmt = 1.0 - exp(-tC / 0.007);\n        vec2 bd = mOff / max(off, 1e-4);\n        vec2 pb = -bd * (rs + rm - off) * 0.5;    // середина серпа\n        vec2 e = u - pb;\n        float db = length(e);\n        float dC = max(max(r - rs, -dm), 0.0);    // расстояние до серпа\n        float s = 0.050 + 1.1 * tC, sc = 0.034 + 0.35 * tC;\n        // Толщина серпа в этом направлении: ореол держится у серпа, а не по всему краю.\n        float tl = max(off * dot(u / max(r, 1e-4), -bd) - (rm - rs), 0.0);\n        float tight = exp(-dC / (0.014 + 0.16 * tC)) * (1.0 - exp(-tl / 0.006));\n        float bloom = exp(-db / 0.8) / (1.0 + db * db / (s * s));\n        float core = exp(-db * db / (sc * sc)) * (1.0 - 0.5 * smoothstep(0.012, 0.045, tC));\n        vec2 e2 = rot(0.52) * e;\n        float sl = 0.05 + 0.20 * wake * bAmt, sw = 0.005 + 0.8 * aw;\n        float spike = exp(-abs(e2.y) / sw) * exp(-abs(e2.x) / sl) + exp(-abs(e2.x) / sw) * exp(-abs(e2.y) / sl);\n        // На лунный диск свет заходит только у самого края: диск остаётся чёрным.\n        float din = min(dm, 0.0);\n        float nearM = mix(1.0, 0.55 * iform float uPupil;\nuniform vec2 uGaze;\nuniform vec2 uGaze2;\nuniform float uLidTop;\nuniform float uLidBot;\nuniform float uEnergy;\nuniform float uWake;\nuniform float uPulse;\nuniform float uDim;\nuniform vec2 uPulseDir;\nuniform float uLight;\nuniform vec4 uC0;\nuniform vec4 uC1;\nuniform vec4 uC2;\nuniform vec4 uC3;\nuniform vec4 uC4;\nuniform vec4 uC5;\nuniform vec4 uC6;\nuniform vec4 uC7;\nuniform vec4 uP0;\nuniform vec4 uP1;\n\n// Общая геометрия и утилиты. Координаты q — в «единицах глаза»:\n// 1 единица = половина высоты раскрытого глаза (uUnit пикселей), ось y направлена вниз.\n// Цвет на выходе eye() — с предумноженной альфой.\n#define PI 3.14159265\n#define TAU 6.28318531\n\n// Рамка глаза одна для всех образов: полуширина раскрытия в единицах.\n#define EYE_W 2.5\n// Радиус глазного яблока: от него зависит, насколько радужка сплющивается при взгляде в сторону.\n#define EYE_R 2.5\n\nfloat hash11(float n) { return fract(sin(n * 127.1) * 43758.5453); }\nfloat hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nvec2 hash22(vec2 p) {\n    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);\n}\nfloat vnoise(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),\n               mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);\n}\n// Шум, замкнутый по x с периодом period: для узоров по углу без шва.\nfloat vnoiseWrap(vec2 p, float period) {\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float x0 = mod(i.x, period), x1 = mod(i.x + 1.0, period);\n    return mix(mix(hash21(vec2(x0, i.y)), hash21(vec2(x1, i.y)), f.x),\n               mix(hash21(vec2(x0, i.y + 1.0)), hash21(vec2(x1, i.y + 1.0)), f.x), f.y);\n}\nmat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }\n\n// Ширина одного пикселя в единицах глаза и покрытие для сглаживания краёв.\nfloat px() { return 1.0 / max(uUnit, 1.0); }\nfloat cover(float d) { float w = px(); return 1.0 - smoothstep(-w, w, d); }\nfloat coverSoft(float d, float w) { return 1.0 - smoothstep(-w, w, d); }\n// Линия полуширины hw вокруг d = 0.\nfloat stroke(float d, float hw) { return cover(abs(d) - hw); }\n\nfloat sdSegment(vec2 p, vec2 a, vec2 b) {\n    vec2 pa = p - a, ba = b - a;\n    return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0));\n}\nfloat sdRoundBox(vec2 p, vec2 b, float r) {\n    vec2 d = abs(p) - b + vec2(r);\n    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;\n}\n\n// Кромка века — дуга окружности через оба уголка (±wi, 0) с вершиной в (0, k).\n// Возвращает расстояние со знаком: больше нуля ниже дуги (y направлена вниз).\nfloat arcBelow(vec2 q, float wi, float k) {\n    if (abs(k) < 0.002) return q.y - k;\n    float rad = (wi * wi + k * k) / (2.0 * abs(k));\n    float cy = k < 0.0 ? k + rad : k - rad;\n    float d = length(vec2(q.x, q.y - cy)) - rad;\n    return k < 0.0 ? -d : d;\n}\n\n// Точное расстояние до линзы из двух дуг: верхняя с вершиной -hu, нижняя с вершиной +hl.\nfloat sdLens(vec2 q, float wi, float hu, float hl) {\n    float ru = (wi * wi + hu * hu) / (2.0 * hu), rl = (wi * wi + hl * hl) / (2.0 * hl);\n    float cu = -hu + ru, cl = hl - rl;                 // центры: верхней дуги — ниже, нижней — выше\n    vec2 a = vec2(abs(q.x), q.y);\n    float d = max(length(vec2(a.x, a.y - cu)) - ru, length(vec2(a.x, a.y - cl)) - rl);\n    // За уголком ближайшая точка — сам уголок.\n    vec2 v = a - vec2(wi, 0.0);\n    vec2 nu = vec2(wi, -cu), nl = vec2(wi, -cl);       // нормали дуг в уголке\n    if (nu.x * v.y - nu.y * v.x > 0.0 && v.x * nl.y - v.y * nl.x > 0.0) d = length(v);\n    return d;\n}\n\n// Силуэт глаза и раскрытие между веками. Все расстояния — в единицах глаза.\n//   dShape < 0 внутри силуэта;\n//   dTop > 0 ниже кромки верхнего века, dBot > 0 выше кромки нижнего (то есть в раскрытой части).\n// rnd скругляет уголки; closeY — где смыкаются веки (ниже центра).\nvoid eyeGeom(vec2 q, float hU, float hL, float rnd, float closeY,\n             out float dShape, out float dTop, out float dBot) {\n    float wi = EYE_W - rnd, hu = hU - rnd, hl = hL - rnd;\n    dShape = sdLens(q, wi, hu, hl) - rnd;\n    float lt = clamp(uLidTop, 0.0, 1.0), lb = clamp(uLidBot, 0.0, 1.0);\n    dTop = arcBelow(q, wi, mix(-hu, closeY, lt)) + rnd * (1.0 - lt);\n    dBot = -arcBelow(q, wi, mix(hl, closeY, lb)) + rnd * (1.0 - lb);\n}\n\n// Центр радужки на экране для направления взгляда g из [-1, 1].\nvec2 irisCenter(vec2 g, vec2 travel, float y0) { return vec2(g.x * travel.x, g.y * travel.y + y0); }\n\n// Координаты точки в плоскости радужки (в её радиусах): яблоко — шар,\n// поэтому при взгляде в сторону диск сплющивается вдоль направления взгляда.\nvec2 irisUV(vec2 q, vec2 c, float rI) {\n    vec2 v = q - c;\n    float cl = length(c);\n    if (cl > 1e-4) {\n        vec2 d = c / cl;\n        float s = sqrt(max(0.2, 1.0 - cl * cl / (EYE_R * EYE_R)));\n        float par = dot(v, d);\n        v += d * (par / s - par);\n    }\n    return v / rI;\n}\n\n// Наложение источника с предумноженной альфой поверх накопленного цвета.\nvec4 over(vec4 dst, vec3 rgb, float a) { return vec4(dst.rgb * (1.0 - a) + rgb * a, dst.a * (1.0 - a) + a); }\n\n// «Сеть»: глаз, сплетённый из узлов и связей; контура нет, силуэт держится плотностью ткани. Цвета:\n//   uC0 связи, uC1 узлы, uC2 пакет и вспышка события (янтарь), uC3 редкие акцентные узлы (мята),\n//   uC4 дымка радужки (объём шара), uC5 пустота зрачка (подложка), uC6 дальние связи у краёв,\n//   uC7 ореол узлов.\n// Устройство. Радужка — полярная решётка: корневой узел, кольца из 8, 16 и 32 узлов, между кольцами\n// спицы «веером» (узел j держит узлы 2j и 2j+1 следующего кольца) и редкие диагонали. Белок — паутина\n// в координатах (угол, доля пути от радужки до кромки миндаля): 32 сектора × 6 рядов, по узлу в ячейке;\n// её первый ряд привязан к внешнему кольцу, поэтому при повороте взгляда ткань тянется.\n// На пиксель считается постоянное число узлов и отрезков: своя ячейка и соседние.\nconst float LT_RI = 0.78;        // радиус радужки в единицах глаза\nconst float LT_N1 = 8.0;\nconst float LT_N2 = 16.0;\nconst float LT_N3 = 32.0;\nconst float LT_K = 6.0;          // рядов паутины\nconst float LT_R2 = 0.67;        // радиус среднего кольца (в радиусах радужки)\nconst float LT_PSI = 0.21;       // общий поворот решётки, чтобы она не была зеркальной\nconst float LT_JA = 0.5;         // разброс узла по углу, доля сектора\n// Окружности век для высот 1.0 и 0.88 при полуширине 2.5: радиус и ордината центра.\n// Радиусы уменьшены на LT_IN: крайний ряд паутины идёт с этим отступом от кромки миндаля.\nconst float LT_IN = 0.065;\nconst float LT_RU = 3.625 - LT_IN;\nconst float LT_CU = 2.625;\nconst float LT_RL = 3.991136 - LT_IN;\nconst float LT_CL = -3.111136;\n\nvec2 ltD;      // направление сплющивания диска радужки\nfloat ltS;     // коэффициент сплющивания\nfloat ltHW;    // полуширина связи\nvec4 ltA;      // накопители: x связи, y свечение связей, z ядра узлов, w ореолы узлов\nvec2 ltB;      // то же для мятных узлов: x ядра, y ореолы\n\nvec2 ltToPlane(vec2 v) { float par = dot(v, ltD); return (v + ltD * (par / ltS - par)) / LT_RI; }\nvec2 ltToScreen(vec2 u) { vec2 v = u * LT_RI; float par = dot(v, ltD); return v + ltD * (par * ltS - par); }\n\n// Где луч o + t·dir выходит из миндаля (пересечения двух окружностей век).\nfloat ltEdge(vec2 o, vec2 dir) {\n    vec2 a = o - vec2(0.0, LT_CU), b = o - vec2(0.0, LT_CL);\n    float A = max(dot(dir, dir), 1e-6);\n    float bu = dot(dir, a), bl = dot(dir, b);\n    float tu = (-bu + sqrt(max(bu * bu - A * (dot(a, a) - LT_RU * LT_RU), 0.0))) / A;\n    float tl = (-bl + sqrt(max(bl * bl - A * (dot(b, b) - LT_RL * LT_RL), 0.0))) / A;\n    return min(tu, tl);\n}\n\nvoid ltLink(vec2 q, vec2 a, vec2 b, float al) {\n    float d = sdSegment(q, a, b);\n    ltA.x = max(ltA.x, al * cover(d - ltHW));\n    ltA.y = max(ltA.y, al * clamp(1.0 - d / 0.05, 0.0, 1.0));\n}\n\nvoid ltDot(vec2 q, vec2 p, float r, float al, float gr, float mint) {\n    float d = length(q - p);\n    float core = al * cover(d - max(r, 0.7 * px()));\n    float halo = al * exp(-d * d / (gr * gr));\n    if (mint > 0.5) { ltB.x = max(ltB.x, core); ltB.y += halo; }\n    else { ltA.z = max(ltA.z, core); ltA.w += halo; }\n}\n\n// Узел кольца i (замыкается по n); смещение от центра кольца в единицах глаза.\nvec2 ltRing(float i, float n, float rad, float jr, float seed) {\n    float k = mod(i, n);\n    vec2 h = hash22(vec2(k, seed));\n    float a = (k + 0.5 + (h.x - 0.5) * LT_JA) / n * TAU + LT_PSI;\n    return ltToScreen(rad * (1.0 + (h.y - 0.5) * jr) * vec2(cos(a), sin(a)));\n}\n\n// Узел с характером: размер, мерцание и редкая мята зависят от номера.\nvoid ltNode(vec2 q, vec2 p, float id, float seed, float nr, float gr, float al, float pm) {\n    float h = hash21(vec2(id, seed + 3.0));\n    float tw = 0.86 + 0.14 * sin(uTime * (0.6 + h) + h * 40.0);\n    ltDot(q, p, nr * (0.78 + 0.5 * h), al * tw, gr, step(1.0 - pm, fract(h * 7.13)));\n}\n\n// Кольцо: цепочка звеньев, узлы и хорды через один узел.\nvoid ltRingDraw(vec2 q, vec2 c, float n, float rad, float jr, float seed,\n                float la, float pl, float nr, float gr, float pm, float chord, float margin) {\n    vec2 u = ltToPlane(q - c);\n    if (abs(length(u) - rad) > margin) return;\n    float i = floor((atan(u.y, u.x) - LT_PSI) / TAU * n);\n    vec2 a = c + ltRing(i - 1.0, n, rad, jr, seed);\n    vec2 b = c + ltRing(i, n, rad, jr, seed);\n    vec2 d = c + ltRing(i + 1.0, n, rad, jr, seed);\n    float ia = mod(i - 1.0, n), ib = mod(i, n), id = mod(i + 1.0, n);\n    float ha = hash21(vec2(ia, seed + 0.5)), hb = hash21(vec2(ib, seed + 0.5));\n    ltLink(q, a, b, la * step(ha, pl) * (0.7 + 0.3 * ha));\n    ltLink(q, b, d, la * step(hb, pl) * (0.7 + 0.3 * hb));\n    ltNode(q, a, ia, seed, nr, gr, 1.0, pm);\n    ltNode(q, b, ib, seed, nr, gr, 1.0, pm);\n    ltNode(q, d, id, seed, nr, gr, 1.0, pm);\n    if (chord > 0.0) {\n        vec2 e = c + ltRing(i - 2.0, n, rad, jr, seed);\n        vec2 g = c + ltRing(i + 2.0, n, rad, jr, seed);\n        ltLink(q, e, b, chord * step(0.35, hash21(vec2(mod(i - 2.0, n), seed + 1.5))));\n        ltLink(q, a, d, chord * step(0.35, hash21(vec2(ia, seed + 1.5))));\n        ltLink(q, b, g, chord * step(0.35, hash21(vec2(ib, seed + 1.5))));\n    }\n}\n\n// Веер между кольцом A (n узлов) и кольцом B (2n узлов): звенья узла j кольца A.\nvoid ltFan(vec2 q, float j, float n, float ra, float ja, float sa, vec2 ca,\n           float rb, float jb, float sb, vec2 cb, float al) {\n    vec2 a = ca + ltRing(j, n, ra, ja, sa);\n    vec2 b0 = cb + ltRing(2.0 * j, 2.0 * n, rb, jb, sb);\n    vec2 b1 = cb + ltRing(2.0 * j + 1.0, 2.0 * n, rb, jb, sb);\n    float h = hash21(vec2(mod(j, n), sa + 0.7));\n    ltLink(q, a, b0, al * (0.65 + 0.35 * h));\n    ltLink(q, a, b1, al * (1.0 - 0.35 * h));\n    // Диагональ четырёхугольника между клиньями всегда выходит из узла своего клина:\n    // так каждое звено видно из обеих ячеек, через которые оно проходит.\n    float hr = fract(h * 13.7);\n    float hq = fract(hash21(vec2(mod(j - 1.0, n), sa + 0.7)) * 13.7);\n    if (hr < 0.30) ltLink(q, a, cb + ltRing(2.0 * j + 2.0, 2.0 * n, rb, jb, sb), al * 0.6);\n    if (hq >= 0.30 && hq < 0.60) ltLink(q, a, cb + ltRing(2.0 * j - 1.0, 2.0 * n, rb, jb, sb), al * 0.6);\n}\n\n// Узел паутины белка: сектор i, ряд k (ряд -1 — узел внешнего кольца радужки).\nvec2 ltWeb(float i, float k, vec2 c3, out float vis) {\n    float ii = mod(i, LT_N3);\n    vec2 h = hash22(vec2(ii, 40.0 + k));\n    float a = (ii + 0.5 + (h.x - 0.5) * LT_JA) / LT_N3 * TAU + LT_PSI;\n    vec2 e = vec2(cos(a), sin(a));\n    if (k < -0.5) { vis = 1.0; return ltToScreen(e); }\n    float span = ltEdge(c3, ltToScreen(e)) - 1.0;\n    float hx = hash21(vec2(ii, k) + 17.3);\n    float nu = 1.0;\n    if (k > LT_K - 1.5) {\n        // Крайний ряд лежит на самой кромке и держит силуэт, даже где белок совсем узкий.\n        vis = step(hx, 0.93) * (0.55 + 0.35 * h.y) * smoothstep(0.03, 0.14, span) * step(k, LT_K - 0.5);\n    } else {\n        nu = (k + 0.5 + (h.y - 0.5) * 0.4) / LT_K;\n        vis = step(hx, mix(0.95, 0.76, nu)) * smoothstep(0.55, 1.0, span);\n    }\n    return ltToScreen(e * (1.0 + nu * max(span, 0.0)));\n}\n\nvoid ltDiag(vec2 q, vec2 id, vec2 a, float va, vec2 b, float vb, vec2 c, float vc, vec2 d, float vd) {\n    float h = hash21(id + vec2(5.3, 9.2));\n    if (h < 0.30) ltLink(q, a, b, min(va, vb) * 0.30);\n    else if (h < 0.58) ltLink(q, c, d, min(vc, vd) * 0.30);\n}\n\n// Звено вдоль ряда k между секторами i и i+1. Крайний ряд связан плотнее и обводит миндаль\n// пунктиром узлов; ряд -1 — цепочка внешнего кольца, её рисует радужка.\nvoid ltRowLink(vec2 q, vec2 a, float va, vec2 b, float vb, float i, float k) {\n    if (k < -0.5) return;\n    float h = hash21(vec2(i, k) + vec2(0.37, 7.1));\n    ltLink(q, a, b, min(va, vb) * step(h, k > LT_K - 1.5 ? 0.90 : 0.68) * (0.36 + 0.2 * h));\n}\n\nvoid ltWebDraw(vec2 q, vec2 c3) {\n    vec2 u = ltToPlane(q - c3);\n    float rho = length(u);\n    if (rho < 0.96) return;\n    float span = ltEdge(c3, ltToScreen(u / rho)) - 1.0;\n    if (span < 0.03) return;\n    float nu = (rho - 1.0) / span;\n    if (nu > 1.0 + 0.06 / (span * LT_RI)) return;\n    float ci = floor((atan(u.y, u.x) - LT_PSI) / TAU * LT_N3);\n    float ck = clamp(floor(nu * LT_K), 0.0, LT_K - 1.0);\n    float v00, v10, v20, v01, v11, v21, v02, v12, v22;\n    vec2 p00 = c3 + ltWeb(ci - 1.0, ck - 1.0, c3, v00);\n    vec2 p10 = c3 + ltWeb(ci, ck - 1.0, c3, v10);\n    vec2 p20 = c3 + ltWeb(ci + 1.0, ck - 1.0, c3, v20);\n    vec2 p01 = c3 + ltWeb(ci - 1.0, ck, c3, v01);\n    vec2 p11 = c3 + ltWeb(ci, ck, c3, v11);\n    vec2 p21 = c3 + ltWeb(ci + 1.0, ck, c3, v21);\n    vec2 p02 = c3 + ltWeb(ci - 1.0, ck + 1.0, c3, v02);\n    vec2 p12 = c3 + ltWeb(ci, ck + 1.0, c3, v12);\n    vec2 p22 = c3 + ltWeb(ci + 1.0, ck + 1.0, c3, v22);\n    float il = mod(ci - 1.0, LT_N3), im = mod(ci, LT_N3);\n    // Вдоль ряда. Соседние ряды тоже: у уголка глаза хорда звена заходит в чужую ячейку.\n    ltRowLink(q, p01, v01, p11, v11, il, ck);\n    ltRowLink(q, p11, v11, p21, v21, im, ck);\n    ltRowLink(q, p00, v00, p10, v10, il, ck - 1.0);\n    ltRowLink(q, p10, v10, p20, v20, im, ck - 1.0);\n    ltRowLink(q, p02, v02, p12, v12, il, ck + 1.0);\n    ltRowLink(q, p12, v12, p22, v22, im, ck + 1.0);\n    // Вдоль луча.\n    float hd = hash21(vec2(im, ck - 1.0) + vec2(3.1, 1.7)), hu = hash21(vec2(im, ck) + vec2(3.1, 1.7));\n    ltLink(q, p10, p11, min(v10, v11) * step(hd, 0.86) * (0.46 + 0.2 * hd));\n    ltLink(q, p11, p12, min(v11, v12) * step(hu, 0.86) * (0.46 + 0.2 * hu));\n    // По одной диагонали на четырёхугольник.\n    ltDiag(q, vec2(il, ck - 1.0), p00, v00, p11, v11, p10, v10, p01, v01);\n    ltDiag(q, vec2(im, ck - 1.0), p10, v10, p21, v21, p20, v20, p11, v11);\n    ltDiag(q, vec2(il, ck), p01, v01, p12, v12, p11, v11, p02, v02);\n    ltDiag(q, vec2(im, ck), p11, v11, p22, v22, p21, v21, p12, v12);\n    float hn = hash21(vec2(im, ck) + 2.9);\n    float edge = step(LT_K - 1.5, ck);\n    ltDot(q, p11, (0.0105 + 0.007 * hn) * mix(1.0, 0.85, edge), v11 * mix(v11, 1.0, edge) * 0.95, 0.022, step(0.92, fract(hn * 5.3)));\n    // Редкие опорные узлы — с тонким кольцом, как у корня.\n    if (fract(hn * 11.7) > 0.86 && edge < 0.5 && span > 1.0)\n        ltA.x = max(ltA.x, v11 * 0.6 * stroke(length(q - p11) - 0.032, 0.8 * ltHW));\n}\n\n// Пыль дальнего плана: редкие точки без связей, по одной на клетку.\nfloat ltDust(vec2 q) {\n    vec2 gq = q / 0.17;\n    vec2 id = floor(gq);\n    vec2 h = hash22(id + 91.0);\n    float d = length((fract(gq) - 0.25 - 0.5 * h) * 0.17);\n    return step(hash21(id + 13.7), 0.42) * (0.3 + 0.7 * h.x) * cover(d - max(0.0058, 0.65 * px()));\n}\n\n// Ордината дуги века с вершиной k на абсциссе x.\nfloat ltArcY(float x, float k) {\n    if (abs(k) .rgb * (0.80 + 0.55 * smoothstep(0.7, -0.9, q.y));\n    plate *= 1.0 + 0.9 * (1.0 - smoothstep(0.070, 0.085, ed));                        // фаска у кромки\n    plate = mix(plate, vi * 0.40, nnBand(ed - 0.085, 0.6 * lw) * 0.8);                // внутренняя линия\n    float sx1 = abs(q.x) + 0.30 * q.y;\n    float seam = max(nnBand(sx1 - 0.92, 0.7 * lw), nnBand(sx1 - 1.72, 0.7 * lw)) * step(0.085, ed);\n    plate = mix(plate, vi * 0.26, seam * 0.9);\n    float vent = max(nnBand(ed - 0.20, lw), max(nnBand(ed - 0.25, lw), nnBand(ed - 0.30, lw))) * nnIn(abs(q.x), -1.0, 0.20) * isTop;\n    plate = mix(plate, vi * 0.36, vent);\n    float label = max(nnIn(q.x, -1.36, -1.24), nnIn(q.x, -1.20, -1.17)) * nnBand(ed - 0.042, 0.014) * isTop;\n    plate = mix(plate, ye, label * mix(0.9, 0.22, closed));\n    plate += cy * exp(-ed / 0.030) * 0.16 * (1.0 - 0.7 * closed);\n\n    vec3 body = mix(plate, inner, open);\n    float lidLine = max(stroke(dTop, lw), stroke(dBot, lw));\n    body = mix(body, cy * mix(1.0, 0.42, closed), lidLine);\n    // Сон: один слабый огонёк на стыке.\n    {\n        float dd = length(q - vec2(0.0, 0.24));\n        body = mix(body, lz, cover(dd - max(0.026, 1.4 * w)) * closed);\n        body += lz * exp(-dd / 0.06) * 0.35 * closed;\n    }\n\n    // ── Пробуждение: строка развёртки ───────────────────────────────────────────────────────────\n    if (uWake > 0.001) {\n        float wk = clamp(uWake, 0.0, 1.0);\n        float ys = mix(-0.95, 0.86, 1.0 - wk);\n        float env = smoothstep(0.0, 0.15, wk);\n        float below = smoothstep(-0.01, 0.03, q.y - ys);\n        body *= mix(1.0, 0.50, below * env);                                          // ниже строки картинка ещё не «проявлена»\n        float row = 0.5 + 0.5 * step(0.5, fract(q.y * uUnit / 3.0));\n        body += cy * exp(-max(ys - q.y, 0.0) / 0.22) * (1.0 - below) * 0.16 * row * env;\n        body += mix(cy, vec3(1.0), 0.55) * exp(-abs(q.y - ys) / max(0.007, 1.1 * w)) * env;\n        body += cy * ex const VS = `#version 300 es
in vec2 a; out vec2 vUv;
void main() { vUv = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); gl_Position = vec4(a, 0.0, 1.0); }`;
const UNI = ['uTime','uSize','uUnit','uPupil','uGaze','uGaze2','uLidTop','uLidBot','uEnergy','uWake','uPulse','uDim','uPulseDir','uLight','uC0','uC1','uC2','uC3','uC4','uC5','uC6','uC7','uP0','uP1'];
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255, 1]; };
function fail(msg) { document.getElementById('err').textContent += msg + '\n'; console.log('SHADER-ERROR ' + msg); }

// Один холст с одним образом: своя программа, своё состояние взгляда и век.
function Eye(canvas, skinId, variant) {
  const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, antialias: false });
  if (!gl) { fail('WebGL2 недоступен'); return null; }
  const eye = { canvas, gl, skinId, variant, progs: {}, t0: performance.now(),
    gx: 0, gy: 0, vx: 0, vy: 0, px: 0, py: 0, tx: 0, ty: 0, pupil: 1, pupilT: 1,
    lidT: 0, lidB: 0, blink: 0, held: 0, sleep: 0, wake: 0, pulse: 0, pdx: 1, pdy: 0, fixed: null };
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  function program(id) {
    if (eye.progs[id]) return eye.progs[id];
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(id + ': ' + gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, DATA.shaders[id]));
    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail(id + ': ' + gl.getProgramInfoLog(p));
    const loc = {}; for (const u of UNI) loc[u] = gl.getUniformLocation(p, u);
    return eye.progs[id] = { p, loc, a: gl.getAttribLocation(p, 'a') };
  }
  eye.draw = function (now) {
    const skin = DATA.skins[eye.skinId], v = skin.variants[eye.variant] || skin.variants.dark;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(canvas.clientWidth * dpr)), h = Math.max(2, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const { p, loc, a } = program(skin.shader);
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    const f = eye.fixed || {};

    gl.uniform2f(loc.uSize, w, h); gl.uniform1f(loc.uUnit, Math.min(h / 2.7, w / 5.7));
    gl.uniform1f(loc.uPupil, f.pupil ?? eye.pupil);
    gl.uniform2f(loc.uGaze, f.gx ?? eye.gx, f.gy ?? eye.gy); gl.uniform2f(loc.uGaze2, f.px ?? f.gx ?? eye.px, f.py ?? f.gy ?? eye.py);
    gl.uniform1f(loc.uLidTop, lidT); gl.uniform1f(loc.uLidBot, lidB);
    gl.uniform1f(loc.uEnergy, f.energy ?? 0); gl.uniform1f(loc.uWake, f.wake ?? eye.wake);

  eye.step = function (dt, pointer) {
    const r = canvas.getBoundingClientRect(), unit = Math.min(r.height / 2.7, r.width / 5.7);

    eye.vx += (k * (eye.tx - eye.gx) - c * eye.vx) * dt; eye.vy += (k * (eye.ty - eye.gy) - c * eye.vy) * dt;
    eye.gx += eye.vx * dt; eye.gy += eye.vy * dt;

}
function tween(obj, key, to, ms, done) { const from = obj[key], t0 = performance.now();
  (function f(now) { const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3); obj[key] = from + (to - from) * e; if (p < 1) requestAnimationFrame(f); else if (done) done(); })(t0); }
function blink(eye) { const m = DATA.skins[eye.skinId].motion || {}; if (eye.sleep) return;
  tween(eye, 'blink', 1, m.blinkClose || 90, () => setTimeout(() => tween(eye, 'blink', 0, m.blinkOpen || 180), m.blinkHold || 30)); }

const q = new URLSearchParams(location.search);
if (q.has('solo')) {
  // Статичный кадр для проверки: ?solo=pearl&variant=dark&gx=0.4&gy=-0.2&lt=0&lb=0&pupil=1&bg=000000
  document.body.classList.add('solo'); const cv = document.getElementById('solo'); cv.hidden = false;
  document.documentElement.style.background = document.body.style.background = '#' + (q.get('bg') || '000000'); document.getElementById('err').style.padding = 0;
  const eye = Eye(cv, q.get('solo'), q.get('variant') || 'dark'); const num = k => q.has(k) ? parseFloat(q.get(k)) : undefined;
  eye.fixed = { gx: num('gx') ?? 0, gy: num('gy') ?? 0, px: num('px'), py: num('py'), lt: num('lt') ?? 0, lb: num('lb') ?? 0, pupil: num('pupil') ?? 1,
    wake: num('wake') ?? 0, pulse: num('pulse') ?? 0, dim: num('dim') ?? 1, energy: num('energy') ?? 0, time: num('time') ?? 0 };
  if (q.has('pdx')) { eye.pdx = num('pdx'); eye.pdy = num('pdy') ?? 0; }
  requestAnimationFrame(now => { eye.draw(now); document.title = 'READY'; });
} else {
  const pointer = { x: innerWidth / 2, y: innerHeight / 2 };
  addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
  let current = q.get('skin') || DATA.order[0], variant = q.get('variant') || 'dark';
  const stage = Eye(document.getElementById('stage'), current, variant); const eyes = [stage];
  const tabs = document.getElementById('tabs'), gallery = document.getElementById('gallery');
  for (const id of DATA.order) {
    const s = DATA.skins[id];
    const b = document.createElement('button'); b.textContent = s.title; b.dataset.id = id; b.onclick = () => select(id); tabs.append(b);
    const card = document.createElement('div'); card.className = 'card'; const cv = document.createElement('canvas');
    const cap = document.createElement('div'); cap.innerHTML = '<b></b><span></span>'; cap.firstChild.textContent = s.title; cap.lastChild.textContent = s.note;
    card.append(cv, cap); card.onclick = () => { select(id); scrollTo({ top: 0, behavior: 'smooth' }); }; gallery.append(card);
    eyes.push(Eye(cv, id, 'dark'));
  }
  function select(id) { current = id; stage.skinId = id; if (!DATA.skins[id].variants[variant]) variant = 'dark'; paint(); }
  function paint() {
    const s = DATA.skins[current], v = s.variants[variant], pg = v.page; stage.variant = variant;
    for (const [k, val] of Object.entries(pg)) document.documentElement.style.setProperty('--' + k, val);
    for (const b of tabs.children) b.setAttribute('aria-pressed', String(b.dataset.id === current));
    const other = variant === 'dark' ? 'light' : 'dark'; const vb = document.getElementById('variant');
    vb.hidden = !s.variants[other]; vb.textContent = 'Вариант: ' + v.title;
    document.getElementById('skinnote').textContent = s.note;
    const sw = document.getElementById('swatches'); sw.textContent = '';
    const names = { bg: 'Фон', surface: 'Поверхность', text: 'Текст', muted: 'Приглушённый', a1: 'Акцент 1', a2: 'Акцент 2', a3: 'Акцент 3', outline: 'Рамка' };
    for (const [k, val] of Object.entries(pg)) { const d = document.createElement('div'); d.className = 'sw'; d.innerHTML = '<i></i><b></b><code></code>';
      d.children[0].style.background = val; d.children[1].textContent = names[k] || k; d.children[2].textContent = val; sw.append(d); }
  }
  document.getElementById('variant').onclick = () => { const o = variant === 'dark' ? 'light' : 'dark'; if (DATA.skins[current].variants[o]) { variant = o; paint(); } };
  document.getElementById('blink').onclick = () => blink(stage);
  document.getElementById('sleep').onclick = e => { const on = !stage.sleep; tween(stage, 'sleep', on ? 1 : 0, on ? 900 : 380, () => { if (!on) { stage.wake = 1; blink(stage); } }); e.target.setAttribute('aria-pressed', String(on)); };
  document.getElementById('notify').onclick = () => { stage.pulse = 0.001; stage.pdx = 0.8; stage.pdy = -0.6; stage.pupilT = 1.12; setTimeout(() => stage.pupilT = 1, 500); };
  const sc = stage.canvas;
  sc.addEventListener('pointerdown', () => tween(stage, 'held', 1, 180)); addEventListener('pointerup', () => stage.held && tween(stage, 'held', 0, 210));
  sc.addEventListener('dblclick', () => { stage.pupilT = 1.3; setTimeout(() => stage.pupilT = 1, 550); });
  (function auto() { setTimeout(() => { eyes.forEach(e => Math.random() < 0.8 && blink(e)); auto(); }, 4000 + Math.random() * 5000); })();
  paint(); let last = performance.now(), acc = 0, frames = 0;
  (function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const e of eyes) { e.step(dt, pointer); e.draw(now); }
    acc += dt; frames++; if (acc > 1) { document.getElementById('meter').textContent = Math.round(frames / acc) + ' кадров в секунду'; acc = 0; frames = 0; }
    requestAnimationFrame(loop); })(last);
}
</script>
